<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Verse of the Week">
    <title>Verse of the Week - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-image: url('background.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;}
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; margin-left: 20px; }
        
        .header-title { text-align: center; padding: 40px 20px; background: rgba(28, 30, 33, 0.8); color: white; }
        .header-title h1 { font-size: 3rem; margin-bottom: 10px; color: #2ed573; }
        .header-title p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }
        
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        .verse-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            color: #1e293b; 
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .verse-text { 
            font-size: 2.2rem; 
            font-weight: bold; 
            line-height: 1.5; 
            margin-bottom: 20px; 
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
        }

        .verse-ref {
            font-size: 1.3rem;
            color: #64748b;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .controls { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        
        .btn { 
            padding: 15px 30px; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s, background 0.3s; 
            color: white;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn:active { transform: translateY(1px); }

        .btn-erase { background: #00a8ff; }
        .btn-erase:hover { background: #008ecc; }
        .btn-reset { background: #e2e8f0; color: #475569; }
        .btn-reset:hover { background: #cbd5e1; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .verse-text { font-size: 1.6rem; } }
    </style>
</head>
<body>
<nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="guidance.html">Real Talk</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    <div class="header-title">
        <h1>Verse of the Week</h1>
        <p>Read it out loud. When you are ready, click "Erase Words" to level up and test your memory.</p>
    </div>
    
    <div class="container">
        <div class="verse-card">
            
            <div class="verse-text" id="verse-display">Loading verse...</div>
            <div class="verse-ref" id="ref-display">Loading reference...</div>

            <div class="controls">
                <button class="btn btn-erase" id="erase-btn" onclick="eraseWords()">🧹 Erase Words</button>
                <button class="btn btn-reset" onclick="resetVerse()">🔄 Reset</button>
            </div>

        </div>
    </div>

    <script>
        // --- EDIT YOUR VERSE HERE EVERY WEEK ---
        const rawVerse = "Do not conform to the pattern of this world, but be transformed by the renewing of your mind. Then you will be able to test and approve what God’s will is—his good, pleasing and perfect will.";
        const verseReference = "Romans 12:2";
        // ---------------------------------------

        let wordsArray = rawVerse.split(" ");
        let hiddenIndices = new Set();
        const verseDisplay = document.getElementById("verse-display");
        const eraseBtn = document.getElementById("erase-btn");

        function renderVerse() {
            let outputHtml = wordsArray.map((word, index) => {
                if (hiddenIndices.has(index)) {
                    // Smart erase: replaces letters with underscores but keeps punctuation
                    return word.replace(/[a-zA-Z]/g, "_");
                }
                return word;
            }).join(" ");
            
            verseDisplay.innerText = outputHtml;
            document.getElementById("ref-display").innerText = verseReference;
        }

        function eraseWords() {
            let availableIndices = [];
            
            // Find words that haven't been hidden yet
            for (let i = 0; i < wordsArray.length; i++) {
                // Only count words that actually have letters in them
                if (!hiddenIndices.has(i) && /[a-zA-Z]/.test(wordsArray[i])) {
                    availableIndices.push(i);
                }
            }

            // If all words are already hidden, change button text and stop
            if (availableIndices.length === 0) {
                eraseBtn.innerText = "🏆 Fully Memorized!";
                eraseBtn.style.background = "#2ed573";
                return;
            }

            // Calculate how many to hide (about 20% of total words each click)
            let amountToHide = Math.max(3, Math.floor(wordsArray.length * 0.2));
            amountToHide = Math.min(amountToHide, availableIndices.length);

            // Shuffle the available words
            availableIndices.sort(() => Math.random() - 0.5);

            // Hide them
            for (let i = 0; i < amountToHide; i++) {
                hiddenIndices.add(availableIndices[i]);
            }

            renderVerse();
        }

        function resetVerse() {
            hiddenIndices.clear();
            eraseBtn.innerText = "🧹 Erase Words";
            eraseBtn.style.background = "#00a8ff";
            renderVerse();
        }

        // Start the engine
        renderVerse();
    </script>
</body>
</html>
