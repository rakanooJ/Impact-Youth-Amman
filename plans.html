<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Bible reading plans and resources.">
    <title>Bible Plans - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #1c1e21; /* Fallback color */
            color: #f8f9fa;
            line-height: 1.6;
        }
        
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 30px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; }
        
        .header-title { text-align: center; padding: 40px 20px; color: white; }
        .header-title h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header-title p { font-size: 1.1rem; color: #cbd5e1; }

        .page-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 300px; gap: 30px; }
        .content-area { display: flex; flex-direction: column; gap: 40px; }
        .plan-title { font-size: 1.8rem; color: #f8f9fa; margin-bottom: 15px; border-left: 5px solid #00a8ff; padding-left: 15px; }
        .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .day-card { background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .day-number { color: #00a8ff; font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .reading { font-size: 1.2rem; color: #1e293b; font-weight: bold; margin-bottom: 5px; }
        .topic { color: #64748b; margin-bottom: 20px; font-size: 0.95rem; }
        .video-btn { display: block; background: #e74c3c; color: white; padding: 10px 16px; text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center; transition: background 0.3s; width: 100%; margin-top: auto; }
        .video-btn:hover { background: #c0392b; }
        .no-video { padding: 10px 16px; color: transparent; user-select: none; margin-top: auto; } 

        .sidebar { background: rgba(255, 255, 255, 0.98); padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: sticky; top: 20px; height: max-content; }
        .sidebar h2 { color: #1e293b; margin-bottom: 20px; text-align: center; }
        .tip-card { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #eee; }
        .tip-card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .time-header { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #1e293b; }
        .min-5 { color: #2ed573; }
        .min-15 { color: #00a8ff; }
        .min-30 { color: #e74c3c; }
        .tip-card p { color: #64748b; font-size: 0.95rem; line-height: 1.5; }

        @media (max-width: 900px) { 
            .page-container { grid-template-columns: 1fr; } 
            .sidebar { position: static; order: -1; margin-bottom: 20px; } 
            .navbar { padding: 10px 20px; } 
        }
    </style>
</head>
