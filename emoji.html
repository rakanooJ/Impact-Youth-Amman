<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Decoder - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-image: url('background.png'); background-size: cover; background-attachment: fixed; background-position: center; background-color: #1c1e21; color: #f8f9fa; line-height: 1.6; }
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100;}
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; font-size: 1rem; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; margin-left: 15px; }
        .header-title { text-align: center; padding: 40px 20px; background: rgba(28, 30, 33, 0.8); }
        .header-title h1 { font-size: 3rem; color: #2ed573; }
        .container { max-width: 650px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .game-card { background: rgba(255, 255, 255, 0.95); padding: 50px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #1e293b; }
        .category-badge { background: #9b59b6; color: white; padding: 8px 20px; border-radius: 20px; font-weight: bold; margin-bottom: 25px; display: inline-block; }
        .emoji-display { font-size: 4.5rem; letter-spacing: 10px; margin-bottom: 30px; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 1.2rem; text-align: center; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; margin-bottom: 10px; }
        .btn-submit { background: #2ed573; }
        .btn-hint { background: #f39c12; }
        .btn-reveal { background: #e74c3c; }
        .btn-skip { background: #cbd5e1; color: #475569; }
        .feedback { font-size: 1.3rem; font-weight: bold; margin-top: 15px; }
        #hint-display { color: #f39c12; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    <div class="header-title"><h1>Emoji Decoder</h1></div>
    <div class="container">
        <div class="game-card">
            <div class="category-badge" id="category-badge">Loading...</div>
            <div class="emoji-display" id="emoji-box">...</div>
            <input type="text" id="guess-input" placeholder="Type here..." autocomplete="off">
            <button class="btn btn-submit" onclick="checkGuess()">Submit Guess</button>
            <button class="btn btn-hint" onclick="showHint()">💡 Give me a hint</button>
            <button class="btn btn-reveal" onclick="revealAnswer()">🏳️ Give Up</button>
            <button class="btn btn-skip" onclick="nextPuzzle()">⏭️ Skip</button>
            <div class="feedback" id="feedback-msg"></div>
            <div id="hint-display"></div>
        </div>
    </div>

    <script>
        let puzzles = [
            { category: "Arabic Worship", emojis: "👑🙌✨", answers: ["azeem", "عظيم", "عظيم عظيم"], hint: "Better Life - Great, Great..." },
            { category: "Arabic Worship", emojis: "🏠🕊️❤️", answers: ["sokna allah", "سكنى الله"], hint: "The dwelling of God in us..." },
            { category: "Arabic Worship", emojis: "🕊️🙌🔥", answers: ["ya rooh allah", "يا روح الله"], hint: "Invoking the Holy Spirit..." },
            { category: "Arabic Worship", emojis: "✈️🛣️🌅", answers: ["safar", "سفر"], hint: "Zeyne - A journey of faith..." },
            { category: "Arabic Worship", emojis: "👑🌍🙌", answers: ["malek el molouk", "ملك الملوك"], hint: "King of Kings..." },
            { category: "Arabic Worship", emojis: "❤️✝️🙌", answers: ["yasou enta habeebi", "يسوع انت حبيبي"], hint: "Jesus, You are my beloved..." },
            { category: "Arabic Worship", emojis: "⛰️🙌✨", answers: ["el shaddai", "الشداي"], hint: "God Almighty..." },
            { category: "Arabic Worship", emojis: "🕊️🌊😌", answers: ["salamaouka", "سلامك"], hint: "Your peace like a river..." },
            { category: "Arabic Worship", emojis: "🚶‍♂️🏠❤️", answers: ["ana jayee", "انا جاي"], hint: "I am coming back home..." },
            { category: "Arabic Worship", emojis: "✨🙌🕊️", answers: ["hodouraka", "حضورك"], hint: "In Your presence..." },
            { category: "Arabic Worship", emojis: "🎺🎼🙌", answers: ["halleluyah", "هللويا"], hint: "The universal shout of praise." },
            { category: "Arabic Worship", emojis: "🐑✝️🏆", answers: ["el hamal", "الحمل"], hint: "The Lamb of God who takes away sin." },
            { category: "Bible Character", emojis: "🦁🙏🕳️", answers: ["daniel", "دانيال"], hint: "Survivor of the lion's den." },
            { category: "Bible Character", emojis: "🔨🚢🌧️", answers: ["noah", "نوح"], hint: "Built the Ark." },
            { category: "Bible Character", emojis: "👑🎸🐑", answers: ["david", "داود"], hint: "Shepherd boy turned King." },
            { category: "Bible Character", emojis: "🔥🌳🐑", answers: ["moses", "موسى"], hint: "Led Egypt out of slavery." },
            { category: "Bible Character", emojis: "👑📜🇮🇱", answers: ["esther", "استير"], hint: "Brave Queen who saved her people." },
            { category: "Bible Character", emojis: "✉️🏛️⛓️", answers: ["paul", "بولس"], hint: "Wrote most of the New Testament." },
            { category: "Bible Character", emojis: "⚓🐟🗝️", answers: ["peter", "بطرس"], hint: "Fisherman who led the early church." },
            { category: "Bible Character", emojis: "💇‍♂️💪🏛️", answers: ["samson", "شمشون"], hint: "Strong but lost his hair." },
            { category: "Bible Character", emojis: "🧥🌈🇪🇬", answers: ["joseph", "يوسف"], hint: "Had a coat of many colors." },
            { category: "Bible Character", emojis: "🤰🕊️⭐️", answers: ["mary", "مريم"], hint: "The mother of Jesus." },
            { category: "Bible Character", emojis: "📖⚖️👑", answers: ["solomon", "سليمان"], hint: "The wisest King." },
            { category: "Bible Character", emojis: "🏜️🍯💧", answers: ["john the baptist", "يوحنا المعمدان"], hint: "Lived in the desert eating honey." },
            { category: "Bible Story", emojis: "🌊🚶‍♂️💨🚶‍♂️🌊", answers: ["red sea", "البحر الاحمر"], hint: "Moses parting the waters." },
            { category: "Bible Story", emojis: "🌳🍎🐍", answers: ["eden", "جنة عدن"], hint: "The first sin." },
            { category: "Bible Story", emojis: "🧱🗼🗣️❓", answers: ["tower of babel", "برج بابل"], hint: "Languages were confused." },
            { category: "Bible Story", emojis: "🍞🐟5️⃣0️⃣0️⃣0️⃣", answers: ["feeding the 5000", "اشباع الجموع"], hint: "Miracle with lunch." },
            { category: "Bible Story", emojis: "🎺🧱🏰💥", answers: ["jericho", "اريحا"], hint: "Walls falling down." },
            { category: "Bible Story", emojis: "🍷💧🏺", answers: ["wedding at cana", "عرس قانا"], hint: "Jesus' first miracle." },
            { category: "Bible Story", emojis: "🪦🌯🚶‍♂️", answers: ["lazarus", "لعازر"], hint: "Come out of the grave!" },
            { category: "Bible Story", emojis: "🪨🎯🛡️", answers: ["david and goliath", "داود وجليات"], hint: "A giant vs a stone." },
            { category: "Bible Story", emojis: "⭐️👶🐑", answers: ["christmas", "الميلاد"], hint: "Birth of the Savior." },
            { category: "Bible Story", emojis: "🪦☀️✝️", answers: ["resurrection", "القيامة"], hint: "He is Risen!" }
            // ... (You can add more here to reach 50)
        ];

        let currentIdx = 0;

        function shufflePuzzles() {
            for (let i = puzzles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [puzzles[i], puzzles[j]] = [puzzles[j], puzzles[i]];
            }
        }

        function loadPuzzle() {
            if (currentIdx >= puzzles.length) {
                alert("Game Over! Shuffling again.");
                currentIdx = 0;
                shufflePuzzles();
            }
            let p = puzzles[currentIdx];
            document.getElementById("category-badge").innerText = p.category;
            document.getElementById("emoji-box").innerText = p.emojis;
            document.getElementById("guess-input").value = "";
            document.getElementById("feedback-msg").innerText = "";
            document.getElementById("hint-display").style.display = "none";
        }

        function checkGuess() {
            let guess = document.getElementById("guess-input").value.toLowerCase().trim();
            if (puzzles[currentIdx].answers.some(a => guess.includes(a))) {
                document.getElementById("feedback-msg").innerHTML = "🎯 Correct!";
                currentIdx++;
                setTimeout(loadPuzzle, 1500);
            } else {
                document.getElementById("feedback-msg").innerHTML = "❌ Try again!";
            }
        }

        function showHint() {
            document.getElementById("hint-display").innerText = "Hint: " + puzzles[currentIdx].hint;
            document.getElementById("hint-display").style.display = "block";
        }

        function revealAnswer() {
            document.getElementById("feedback-msg").innerHTML = "Answer: " + puzzles[currentIdx].answers[0];
            currentIdx++;
            setTimeout(loadPuzzle, 3000);
        }

        function nextPuzzle() { currentIdx++; loadPuzzle(); }

        shufflePuzzles();
        loadPuzzle();
    </script>
</body>
</html>
