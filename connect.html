<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Connect & Share">
    <title>Connect - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-image: url('background.png'); background-size: cover; background-attachment: fixed; background-position: center; background-color: #1c1e21; color: #f8f9fa; line-height: 1.6; }
        
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100;}
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; transition: color 0.3s; font-size: 1rem; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; margin-left: 15px; transition: background 0.3s;}
        .login-btn:hover { background: #008ecc !important; }
        
        .header-title { text-align: center; padding: 40px 20px; background: rgba(28, 30, 33, 0.8); color: white; }
        .header-title h1 { font-size: 3rem; margin-bottom: 10px; color: #00a8ff; }
        .header-title p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }
        
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        
        .form-card { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #1e293b; text-align: center;}
        
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; color: #334155; }
        
        select { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 1.2rem; font-family: inherit; background: #f8f9fa; font-weight: bold; color: #00a8ff; cursor: pointer;}
        select:focus { outline: none; border-color: #00a8ff; }

        .google-form-container { display: none; width: 100%; margin-top: 20px; }
        .active-form { display: block; }
        iframe { width: 100%; height: 750px; border: none; border-radius: 8px; background: transparent; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } iframe { height: 650px; } }
    </style>
</head>
<body>
<nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="guidance.html">Real Talk</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    <div class="header-title">
        <h1>The Drop Box</h1>
        <p>Need prayer? Have a tough question about faith? Or an idea for youth group? Drop it here.</p>
    </div>
    
    <div class="container">
        <div class="form-card">
            <div class="form-group">
                <label for="submission-type">What are you sending us?</label>
                <select id="submission-type" onchange="switchForm()">
                    <option value="prayer">🙏 Prayer Request Form</option>
                    <option value="qna">❓ Q&A and Suggestions Form</option>
                </select>
            </div>

            <div id="prayer" class="google-form-container active-form">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdvg39ep0_D05gBTp27G9dPwqVRuU1mCAzKCJQNhNAbyESsZQ/viewform?usp=header">Loading Prayer Form...</iframe>
            </div>

            <div id="qna" class="google-form-container">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe0bn2kgaEt1yMpDZQQAMQwEigog6lkc9Y4-rXMKE7RnVjZwQ/viewform?usp=header">Loading Q&A Form...</iframe>
            </div>

        </div>
    </div>

    <script>
        function switchForm() {
            document.getElementById("prayer").classList.remove("active-form");
            document.getElementById("qna").classList.remove("active-form");
            
            const selectedType = document.getElementById("submission-type").value;
            document.getElementById(selectedType).classList.add("active-form");
        }
    </script>
</body>
</html>s
