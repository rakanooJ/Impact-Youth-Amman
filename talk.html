<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Table Talk Conversation Starters">
    <title>Table Talk - Impact Youth Amman</title>
    <style>
        /* 1. Global Reset & Pro Background */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: url('background.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        
        /* 2. Professional Navigation Bar */
        .navbar { 
            background-color: #1c1e21; padding: 12px 60px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; transition: color 0.3s; font-size: 1rem; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 10px 22px; border-radius: 6px; color: white !important; margin-left: 20px; font-weight: bold; }
        
        /* 3. Header Styling */
        .header-title { 
            text-align: center; padding: 60px 20px; background: rgba(28, 30, 33, 0.85); 
            border-bottom: 1px solid #333;
        }
        .header-title h1 { font-size: 3.5rem; margin-bottom: 15px; color: #f1c40f; text-transform: uppercase; letter-spacing: 2px; }
        .header-title p { font-size: 1.2rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }
        
        /* 4. The Interactive Card */
        .container { max-width: 750px; margin: 50px auto; padding: 0 20px; text-align: center; }
        
        .question-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 60px 40px; 
            border-radius: 18px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            color: #1e293b; 
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1);
            opacity: 1;
            margin-bottom: 40px;
            border-top: 10px solid #f1c40f;
        }

        .question-card.animating { transform: scale(0.95) translateY(10px); opacity: 0; }

        .question-type { font-size: 1.1rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .question-text { font-size: 2.2rem; font-weight: bold; line-height: 1.3; color: #0f172a; margin-bottom: 20px; }
        
        /* Scripture Anchor Styling */
        .verse-anchor {
            display: none; /* Hidden by default for icebreakers */
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            font-size: 1.1rem;
            font-weight: 600;
            color: #475569;
            margin-top: 20px;
        }

        /* 5. Button Controls */
        .controls { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        
        .btn { 
            padding: 18px 35px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.3rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; 
            color: white;
            text-transform: uppercase;
        }
        
        .btn:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .btn:active { transform: translateY(1px); }

        .btn-ice { background: linear-gradient(135deg, #00a8ff, #0097e6); }
        .btn-deep { background: linear-gradient(135deg, #e74c3c, #c0392b); }

        @media (max-width: 768px) { 
            .navbar { padding: 10px 20px; } .nav-links { display: none; } 
            .question-text { font-size: 1.6rem; } .header-title h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    
    <div class="header-title">
        <h1>Table Talk</h1>
        <p>No more awkward silences. Pull a card, ask the question, and get the group talking.</p>
    </div>
    
    <div class="container">
        <div class="question-card" id="card">
            <div>
                <div class="question-type" id="type-label">Select a Deck</div>
                <div class="question-text" id="q-text">Tap a button below to draw your first card!</div>
                <div class="verse-anchor" id="v-text"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-ice" onclick="drawCard('ice')">🧊 Break the Ice</button>
            <button class="btn btn-deep" onclick="drawCard('deep')">🔥 Go Deep</button>
        </div>
    </div>

    <script>
        // THE VAULT (Upgraded with Verses & Objects for Deep questions)
        const vaults = {
            ice: [
                "If you had to eat one meal for the rest of your life, what would it be?",
                "What is the most embarrassing fashion trend you ever participated in?",
                "Would you rather fight one horse-sized duck or a hundred duck-sized horses?",
                "What is a controversial food opinion you strongly believe?",
                "If you could instantly become an expert in one thing, what would it be?",
                "What is the weirdest YouTube rabbit hole you've ever fallen down?",
                "If your life was a movie, what song would play during the opening credits?",
                "What is the best useless talent you have?",
                "If you were a superhero, what would your highly specific, slightly useless power be?",
                "What is the worst haircut you've ever had?",
                "If you could teleport anywhere right now for 24 hours, where would you go?",
                "What is a popular movie or show that you think is totally overrated?",
                "What is your go-to late night snack?",
                "If animals could talk, which species would be the rudest?",
                "What is the silliest thing you believed as a kid?",
                "What is your favorite app on your phone right now?",
                "If you won the lottery tomorrow, what is the very first thing you'd buy?",
                "If you had to survive a zombie apocalypse with 3 people in this room, who are you picking?",
                "If you could have dinner with any historical figure, who would it be?",
                "Would you rather have a rewind button or a pause button for your life?",
                "What is the most chaotic thing you’ve ever done out of boredom?",
                "Would you rather always be 10 minutes late or 20 minutes early?",
                "What is a movie quote you use in real life all the time?",
                "If you were a pro wrestler, what would be your entrance theme song?",
                "Would you rather lose all your money or all your pictures?",
                "What is a weird habit you have when you are nervous?",
                "What is a song you secretly love but pretend to hate?",
                "If you had to describe yourself using only three emojis, what are they?",
                "What is your go-to karaoke song?",
                "Would you rather give up your smartphone or give up junk food for a year?"
            ],
            deep: [
                { q: "When was a specific time you felt really close to God?", v: "Psalm 145:18" },
                { q: "What is a piece of advice you’ve received that you still think about?", v: "Proverbs 19:20" },
                { q: "What is the hardest part about being a Christian in your daily life right now?", v: "John 15:18-19" },
                { q: "If you could ask God one question and get an immediate answer, what would it be?", v: "Jeremiah 33:3" },
                { q: "Who has had the biggest impact on your faith journey and why?", v: "Hebrews 13:7" },
                { q: "What is a habit you want to build this year to grow spiritually?", v: "1 Timothy 4:7" },
                { q: "When you go through a hard time, how do you usually respond?", v: "James 1:2-4" },
                { q: "What is a Bible verse or story that always gives you peace?", v: "Psalm 119:165" },
                { q: "What does the word 'worship' mean to you practically?", v: "Romans 12:1" },
                { q: "How do you handle doubt when it creeps in?", v: "Mark 9:24" },
                { q: "What is something you are actively praying for right now?", v: "Philippians 4:6" },
                { q: "How does the community here at Impact help your faith?", v: "Hebrews 10:24-25" },
                { q: "What is a mistake you made that taught you a massive lesson?", v: "Proverbs 24:16" },
                { q: "Where do you see God working in your life recently?", v: "Philippians 1:6" },
                { q: "What is the biggest distraction keeping you from reading your Bible?", v: "Matthew 6:33" },
                { q: "If you had to summarize your testimony in one sentence, what would it be?", v: "Revelation 12:11" },
                { q: "What is something you need to let go of or forgive?", v: "Ephesians 4:32" },
                { q: "How can this small group best support you this week?", v: "Galatians 6:2" },
                { q: "What is an area of your life where you struggle to trust God?", v: "Proverbs 3:5-6" },
                { q: "When was a time you had to take a leap of faith?", v: "Hebrews 11:1" },
                { q: "What does the word 'grace' mean to you personally?", v: "Ephesians 2:8-9" },
                { q: "Who is someone in the Bible you relate to the most and why?", v: "Romans 15:4" },
                { q: "What is something you are afraid of, and how does your faith impact that fear?", v: "Isaiah 41:10" },
                { q: "What is a spiritual gift you see in the person sitting to your right?", v: "1 Peter 4:10" },
                { q: "How do you balance being 'in the world but not of it' at school or university?", v: "Romans 12:2" },
                { q: "What is the biggest idol in your life right now?", v: "1 John 5:21" },
                { q: "When was a time someone showed you the love of Jesus in a tangible way?", v: "John 13:34-35" },
                { q: "What does it look like for you to practically 'take up your cross daily'?", v: "Luke 9:23" },
                { q: "How does knowing God is sovereign change how you view your future?", v: "Proverbs 16:9" },
                { q: "If you could ensure this youth group remembered one thing about God, what would it be?", v: "Romans 8:38-39" }
            ]
        };

        // Anti-Repeat Trackers
        let iceTracker = [...vaults.ice];
        let deepTracker = [...vaults.deep];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Shuffle initially
        shuffle(iceTracker);
        shuffle(deepTracker);

        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const typeLabel = document.getElementById('type-label');
        const vText = document.getElementById('v-text');

        function drawCard(type) {
            let selectedQuestion;

            // Handle Icebreakers
            if (type === 'ice') {
                if (iceTracker.length === 0) {
                    iceTracker = [...vaults.ice];
                    shuffle(iceTracker);
                }
                selectedQuestion = iceTracker.pop();
            } 
            // Handle Deep Questions
            else {
                if (deepTracker.length === 0) {
                    deepTracker = [...vaults.deep];
                    shuffle(deepTracker);
                }
                selectedQuestion = deepTracker.pop();
            }

            card.classList.add('animating');

            setTimeout(() => {
                if (type === 'ice') {
                    typeLabel.innerText = "🧊 Icebreaker";
                    typeLabel.style.color = "#00a8ff";
                    card.style.borderTop = "10px solid #00a8ff";
                    qText.innerText = selectedQuestion;
                    vText.style.display = "none"; // Hide verse for icebreakers
                } else {
                    typeLabel.innerText = "🔥 Faith & Life";
                    typeLabel.style.color = "#e74c3c";
                    card.style.borderTop = "10px solid #e74c3c";
                    qText.innerText = selectedQuestion.q;
                    vText.innerText = "📖 Scripture Anchor: " + selectedQuestion.v;
                    vText.style.display = "block"; // Show verse for deep questions
                }
                
                card.classList.remove('animating');
            }, 300);
        }
    </script>
</body>
</html>
