            display: flex; align-items: center; justify-content: center;
        }
        
        /* 5. Choice Buttons */
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .btn-choice { 
            padding: 24px; border: none; border-radius: 12px; font-size: 1.5rem; font-weight: bold;

        .btn-movie { background: #9b59b6; box-shadow: 0 5px 15px rgba(155, 89, 182, 0.3); }
        .btn-choice:hover { transform: translateY(-6px); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .btn-skip { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #475569; }

        /* 6. Feedback & Reveal */
        .feedback { font-size: 1.6rem; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        .reference-box { display: block; font-size: 1.2rem; color: #475569; margin-top: 8px; font-weight: 600; font-family: 'Segoe UI', sans-serif; font-style: normal; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .header-title h1 { font-size: 2rem; } .quote-box { font-size: 1.5rem; } .choice-grid { grid-template-columns: 1fr; } }
    </style>

        let currentIdx = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuote() {
            if (currentIdx >= library.length) {
                alert("🏆 Epic Achievement! You cleared the Expert set. Reshuffling...");
                currentIdx = 0; shuffle(library);
            }
            // DYNAMIC COUNTER FIX HERE
            document.getElementById("progress-counter").innerText = `Quote ${currentIdx + 1} / ${library.length}`;
            document.getElementById("quote-display").innerText = `"${library[currentIdx].q}"`;
            document.getElementById("feedback-msg").innerHTML = "";
        }

        function checkAnswer(choice) {
            const item = library[currentIdx];
            const isCorrect = (choice === item.a);
            
            if (isCorrect) {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="correct">✅ Correct Decision!</span><br><span class="reference-box">Ref: ${item.ref}</span>`;
            } else {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="wrong">❌ Misjudged! It's ${item.a.toUpperCase()}.</span><br><span class="reference-box">Ref: ${item.ref}</span>`;
            }
            currentIdx++;
            setTimeout(loadQuote, 2800); // Gives them a little more time to read the funny references before jumping
        }

        function nextQuote() { currentIdx++; loadQuote(); }

        shuffle(library);
        loadQuote();
    </script>
