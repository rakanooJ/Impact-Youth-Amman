<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Emoji Decoder Game">
    <title>Emoji Decoder - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-image: url('background.png'); background-size: cover; background-attachment: fixed; background-position: center; background-color: #1c1e21; color: #f8f9fa; line-height: 1.6; }
        
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;}
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; transition: color 0.3s; font-size: 1rem; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; margin-left: 20px; }
        
        .header-title { text-align: center; padding: 40px 20px; background: rgba(28, 30, 33, 0.8); color: white; }
        .header-title h1 { font-size: 3rem; margin-bottom: 10px; color: #2ed573; }
        .header-title p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }
        
        .container { max-width: 650px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        .game-card { background: rgba(255, 255, 255, 0.95); padding: 50px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #1e293b; transition: all 0.3s ease; position: relative; }
        
        /* New Category Badge */
        .category-badge { background: #9b59b6; color: white; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 25px; }

        .emoji-display { font-size: 4.5rem; letter-spacing: 10px; margin-bottom: 30px; }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        input[type="text"] { padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 1.2rem; text-align: center; font-weight: bold; }
        input[type="text"]:focus { outline: none; border-color: #2ed573; }
        
        .btn { padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: background 0.3s; color: white; }
        .btn-submit { background: #2ed573; }
        .btn-submit:hover { background: #27ae60; }
        .btn-skip { background: #e2e8f0; color: #475569; }
        .btn-skip:hover { background: #cbd5e1; }
        .btn-hint { background: #f39c12; margin-top: 10px; }
        
        .feedback { font-size: 1.3rem; font-weight: bold; margin-top: 20px; min-height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        #hint-display { margin-top: 15px; color: #f39c12; font-weight: bold; font-size: 1.1rem; display: none; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .emoji-display { font-size: 3.5rem; letter-spacing: 5px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="verse.html">Verse</a>
            <a href="talk.html">Table Talk</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="prayer.html">Prayer Room</a>
            <a href="socials.html" class="login-btn">Socials</a>
        </div>
    </nav>
    
    <div class="header-title">
        <h1>The Emoji Decoder</h1>
        <p>Can you guess the worship song, Bible character, or famous story using only a string of emojis?</p>
    </div>
    
    <div class="container">
        <div class="game-card">
            
            <div class="category-badge" id="category-badge">Loading...</div>
            <div class="emoji-display" id="emoji-box">🌊🚶‍♂️👀</div>
            
            <div class="input-group">
                <input type="text" id="guess-input" placeholder="Type answer in English or Arabic..." autocomplete="off">
                <button class="btn btn-submit" onclick="checkGuess()">Submit Guess</button>
            </div>
            
            <div class="feedback" id="feedback-msg"></div>

            <button class="btn btn-hint" onclick="showHint()">💡 Give me a hint</button>
            <div id="hint-display"></div>

            <br><br>
            <button class="btn btn-skip" onclick="nextPuzzle()">⏭️ Skip to next</button>

        </div>
    </div>

    <script>
        // The Master Vault - Categories, Emojis, Hints, and Bilingual Answers
        const puzzles = [
            // --- ARABIC WORSHIP SONGS (Better Life & Classics) ---
            { category: "Arabic Worship", emojis: "❌🤲➡️✝️", answers: ["maly sewak", "مالي سواك", "مالي سواك يا سيدي"], hint: "Classic - Nothing else but you..." },
            { category: "Arabic Worship", emojis: "🦸‍♂️🛡️⚔️", answers: ["ana batal", "انا بطل", "أنا بطل", "بطل"], hint: "Better Life (Kids) - I am a hero..." },
            { category: "Arabic Worship", emojis: "🦅⛰️☁️", answers: ["zay el nasr", "زي النسر", "زى النسر", "مثل النسر"], hint: "Better Life - Like an eagle..." },
            { category: "Arabic Worship", emojis: "🏠🕊️❤️", answers: ["sokna allah", "سكنى الله", "سكني الله", "سكنى الله فينا"], hint: "Dwelling of God in us..." },
            { category: "Arabic Worship", emojis: "👑🙌✨", answers: ["azeem azeem", "عظيم عظيم", "azeem", "عظيم"], hint: "Classic praise - Great, great..." },

            // --- ENGLISH WORSHIP SONGS ---
            { category: "English Worship", emojis: "🌊🚶‍♂️👀", answers: ["oceans", "oceans where feet may fail"], hint: "Hillsong United - Think water..." },
            { category: "English Worship", emojis: "🦁🐑👑", answers: ["lion and the lamb", "the lion and the lamb"], hint: "Bethel Music - Two animals..." },
            { category: "English Worship", emojis: "1️⃣0️⃣0️⃣0️⃣0️⃣ 🗣️", answers: ["10,000 reasons", "10000 reasons", "ten thousand reasons"], hint: "Matt Redman - A big number..." },
            { category: "English Worship", emojis: "❤️🏃‍♂️9️⃣9️⃣", answers: ["reckless love", "the reckless love of god"], hint: "Cory Asbury - He leaves the ninety-nine..." },
            { category: "English Worship", emojis: "🛣️🛠️✨", answers: ["way maker", "waymaker"], hint: "Leeland / Sinach - Miracle worker, promise keeper..." },

            // --- BIBLE CHARACTERS ---
            { category: "Bible Character", emojis: "🐑🎸👑🪨", answers: ["david", "داود", "الملك داود"], hint: "A shepherd boy who became king..." },
            { category: "Bible Character", emojis: "⛵🌊🐋🏃", answers: ["jonah", "يونان", "النبي يونان"], hint: "He tried to run away from God on a boat..." },
            { category: "Bible Character", emojis: "🌊🚶‍♂️🔥🌳", answers: ["moses", "موسى", "النبي موسى"], hint: "He split the sea and saw a burning bush..." },
            { category: "Bible Character", emojis: "🌧️🚢🌈🕊️", answers: ["noah", "نوح", "ابونا نوح"], hint: "He built a really big boat..." },
            { category: "Bible Character", emojis: "🦁🙏🕳️", answers: ["daniel", "دانيال", "النبي دانيال"], hint: "He survived a night with some hungry cats..." },
            { category: "Bible Character", emojis: "🌳👀🏃‍♂️💰", answers: ["zacchaeus", "زكا", "زكا العشار"], hint: "A short tax collector who climbed a tree..." },

            // --- BIBLE STORIES ---
            { category: "Bible Story", emojis: "🍞🐟✖️5️⃣0️⃣0️⃣0️⃣", answers: ["feeding the 5000", "feeding 5000", "اشباع الجموع", "الخمس خبزات", "خمس خبزات وسمكتين"], hint: "Jesus multiplies a boy's lunch..." },
            { category: "Bible Story", emojis: "🧱🗼🗣️❓", answers: ["tower of babel", "babel", "برج بابل", "بابل"], hint: "People tried to build a tower to heaven..." },
            { category: "Bible Story", emojis: "🚶‍♂️🌊🤚🌪️", answers: ["walking on water", "peter walking on water", "المشي على الماء", "يسوع يمشي على الماء"], hint: "A miraculous stroll across the lake..." }
        ];

        let currentPuzzleIndex = -1;
        let currentPuzzle;
        
        const categoryBadge = document.getElementById("category-badge");
        const emojiBox = document.getElementById("emoji-box");
        const guessInput = document.getElementById("guess-input");
        const feedbackMsg = document.getElementById("feedback-msg");
        const hintDisplay = document.getElementById("hint-display");

        function loadRandomPuzzle() {
            currentPuzzleIndex = Math.floor(Math.random() * puzzles.length);
            currentPuzzle = puzzles[currentPuzzleIndex];
            
            // Update Category Color dynamically based on the type
            if(currentPuzzle.category === "Arabic Worship") { categoryBadge.style.background = "#e74c3c"; }
            else if(currentPuzzle.category === "English Worship") { categoryBadge.style.background = "#00a8ff"; }
            else if(currentPuzzle.category === "Bible Character") { categoryBadge.style.background = "#f39c12"; }
            else { categoryBadge.style.background = "#9b59b6"; }

            categoryBadge.innerText = currentPuzzle.category;
            emojiBox.innerText = currentPuzzle.emojis;
            guessInput.value = "";
            feedbackMsg.innerText = "";
            hintDisplay.style.display = "none";
            guessInput.focus();
        }

        function checkGuess() {
            let userGuess = guessInput.value.toLowerCase().trim();
            
            if (currentPuzzle.answers.includes(userGuess)) {
                feedbackMsg.innerText = "🎯 Correct! Awesome job.";
                feedbackMsg.className = "feedback correct";
                setTimeout(loadRandomPuzzle, 2000);
            } else {
                feedbackMsg.innerText = "❌ Not quite! Try again.";
                feedbackMsg.className = "feedback wrong";
            }
        }

        function showHint() {
            hintDisplay.innerText = "Hint: " + currentPuzzle.hint;
            hintDisplay.style.display = "block";
        }

        function nextPuzzle() {
            loadRandomPuzzle();
        }

        guessInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkGuess();
            }
        });

        loadRandomPuzzle();
    </script>
</body>
</html>
