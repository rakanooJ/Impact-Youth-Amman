<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - The Betrayal Game">
    <title>The Betrayal - Impact Youth Amman</title>
    <style>
        /* Global Reset & Dark Theme */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; color: #f8f9fa; line-height: 1.6; 
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar { 
            background-color: #1c1e21; padding: 12px 60px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 1rem; }
        .nav-links a:hover { color: #00a8ff; }

        /* Game Container */
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        .game-card { 
            background: rgba(30, 41, 59, 0.9); padding: 50px 30px; border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-top: 8px solid #e74c3c;
            min-height: 500px; display: flex; flex-direction: column; justify-content: center;
        }

        .title { font-size: 3.5rem; color: #e74c3c; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(231, 76, 60, 0.4); }
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 30px; }

        /* Inputs & Buttons */
        .input-group { margin-bottom: 30px; }
        .player-input { 
            width: 100%; max-width: 200px; padding: 15px; font-size: 2rem; 
            text-align: center; border-radius: 10px; border: 2px solid #475569; 
            background: #0f172a; color: white; font-weight: bold;
        }
        .player-input:focus { outline: none; border-color: #e74c3c; }

        .btn { 
            padding: 20px 40px; border: none; border-radius: 12px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; 
            transition: all 0.2s; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px); }
        
        .btn-start { background: #e74c3c; margin-top: 10px; }
        .btn-start:hover { background: #c0392b; }
        
        .btn-reveal { background: #00a8ff; }
        .btn-reveal:hover { background: #008ecc; }
        
        .btn-hide { background: #f39c12; margin-top: 30px; }
        .btn-hide:hover { background: #d35400; }

        /* ROLE REVEAL UI */
        .role-image-wrapper { margin-bottom: 20px; width: 100%; display: flex; justify-content: center; }
        .role-art { 
            height: 200px; width: auto; 
            border-radius: 15px; 
            border: 4px solid; 
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            background: white; 
        }
        
        .role-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .role-desc { font-size: 1.2rem; color: #cbd5e1; line-height: 1.6; padding: 0 10px; }

        /* Specific Role Colors */
        .role-pharisee { color: #e74c3c; border-color: #e74c3c !important; }
        .role-judas { color: #c0392b; border-color: #c0392b !important; }
        .role-caiaphas { color: #8e44ad; border-color: #8e44ad !important; } /* Deep Purple */
        .role-jesus { color: #f1c40f; border-color: #f1c40f !important; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .role-luke { color: #2ed573; border-color: #2ed573 !important; }
        .role-john { color: #9b59b6; border-color: #9b59b6 !important; }
        .role-peter { color: #94a3b8; border-color: #94a3b8 !important; } 
        .role-disciple { color: #00a8ff; border-color: #00a8ff !important; }

        /* Screen States */
        #setup-screen, #lock-screen, #reveal-screen, #end-screen { display: none; }
        .active-screen { display: flex !important; flex-direction: column; justify-content: center; }

        .player-turn-text { font-size: 2rem; font-weight: bold; color: #f8f9fa; margin-bottom: 30px; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .title { font-size: 2.8rem; } .role-title { font-size: 2rem; } .role-art { height: 150px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="spirit-fun.html">Back to Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    
    <div class="container">
        
        <div class="game-card active-screen" id="setup-screen">
            <div class="title">The Betrayal</div>
            <div class="subtitle">Find the imposters before they silence the early church.</div>
            
            <div class="input-group">
                <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #94a3b8;">Total Players (Min 5)</div>
                <input type="number" id="player-count" class="player-input" min="5" max="30" value="8">
            </div>
            
            <button class="btn btn-start" onclick="generateDeck()">Hand Out Roles</button>
        </div>

        <div class="game-card" id="lock-screen">
            <div class="player-turn-text" id="lock-text">Pass phone to Player 1</div>
            <button class="btn btn-reveal" id="reveal-btn" onclick="showRole()">👀 I am Player 1 (Reveal)</button>
        </div>

        <div class="game-card" id="reveal-screen">
            <div class="role-image-wrapper">
                <img src="" alt="Role Art" class="role-art" id="role-art" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><rect width=\'200\' height=\'200\' fill=\'%231e293b\'/><text x=\'50%\' y=\'50%\' fill=\'white\' font-size=\'24\' font-family=\'sans-serif\' text-anchor=\'middle\' dominant-baseline=\'middle\'>No Image</text></svg>'">
            </div>
            <div class="role-title" id="role-title">Loading...</div>
            <div class="role-desc" id="role-desc">Role description goes here.</div>
            
            <button class="btn btn-hide" onclick="nextPlayer()">🔒 Hide & Pass to Next</button>
        </div>

        <div class="game-card" id="end-screen">
            <div class="role-image-wrapper">
                <div style="font-size: 6rem;">🌙</div>
            </div>
            <div class="role-title" style="color: #f1c40f;">Night Falls</div>
            <div class="role-desc" style="margin-bottom: 30px;">All roles are locked in. Give the phone to the Storyteller to begin the first night.</div>
            <button class="btn btn-start" onclick="location.reload()">Reset Game</button>
        </div>

    </div>

    <script>
        // THE MASTER ROLE DATABASE
   // THE MASTER ROLE DATABASE (Updated for your exact filenames)
        const roleData = {
            pharisee: {
                title: "Pharisee", img: "Pharisee.png", cssClass: "role-pharisee",
                desc: "IMPOSTER: You want to silence the church. Wake up during the night with the other Imposters to eliminate one player. Blend in during the day."
            },
            judas: {
                title: "Judas", img: "Judas.png", cssClass: "role-judas",
                desc: "MASTER IMPOSTER: You wake up with the Pharisees at night. PASSIVE POWER: If John the Seer investigates you, you will falsely appear as an innocent Disciple."
            },
            caiaphas: {
                title: "High Priest Caiaphas", img: "Caiaphas.png", cssClass: "role-caiaphas",
                desc: "MASTER IMPOSTER: Wake up with the Pharisees at night. ACTIVE POWER: After the elimination, point to a second player to 'Silence' them. They cannot speak a single word during the entire next day."
            },
            jesus: {
                title: "The Messiah", img: "jesus.png", cssClass: "role-jesus",
                desc: "THE LIGHT: If eliminated, stay completely silent. Wait exactly 3 rounds (3 Days). On the 3rd day, announce your resurrection! You are now immune to elimination, 100% confirmed innocent, and you may immediately cast 'Divine Judgment' to eliminate ONE player of your choice."
            },
            luke: {
                title: "Luke the Healer", img: "Luke.png", cssClass: "role-luke",
                desc: "SPECIAL ROLE: The Storyteller will ask you to open your eyes at night. Point to one person. That person cannot be eliminated tonight. You may save yourself, but not twice in a row."
            },
            john: {
                title: "John the Seer", img: "John.png", cssClass: "role-john",
                desc: "SPECIAL ROLE: The Storyteller will ask you to open your eyes at night. Point to one person. The Storyteller will nod YES if they are an Imposter, or NO if they are innocent (Note: Judas will appear innocent)."
            },
            peter: {
                title: "Peter the Rock", img: "Peter.png", cssClass: "role-peter",
                desc: "SPECIAL ROLE: You do not wake up at night. PASSIVE POWER: The first time the Pharisees try to eliminate you, your faith protects you, and you survive the attack."
            },
            disciple: {
                title: "Faithful Disciple", img: "Disciple.png", cssClass: "role-disciple",
                desc: "CITIZEN: You sleep through the night. Pay close attention during the day, listen to the arguments, and use your vote to find the imposters."
            }
        };

        let deck = [];
        let currentPlayerIndex = 0;

        const setupScreen = document.getElementById("setup-screen");
        const lockScreen = document.getElementById("lock-screen");
        const revealScreen = document.getElementById("reveal-screen");
        const endScreen = document.getElementById("end-screen");

        function switchScreen(screenToShow) {
            setupScreen.classList.remove("active-screen");
            lockScreen.classList.remove("active-screen");
            revealScreen.classList.remove("active-screen");
            endScreen.classList.remove("active-screen");
            screenToShow.classList.add("active-screen");
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateDeck() {
            const count = parseInt(document.getElementById("player-count").value);
            if (count < 5) { alert("You need at least 5 players!"); return; }

            deck = [];
            
            // 1. Calculate Bad Guys (Using user's Math.round logic)
            // Divide by 4 and round to nearest whole number (Max ensures at least 1)
            let totalImposters = Math.max(1, Math.round(count / 4));
            
            // Distribute Imposter Roles
            if (totalImposters === 1) {
                deck.push("pharisee");
            } else if (totalImposters === 2) {
                deck.push("judas");
                deck.push("pharisee");
            } else {
                deck.push("judas");
                deck.push("caiaphas");
                // Fill the rest of the imposter slots with basic Pharisees
                for (let i = 0; i < totalImposters - 2; i++) {
                    deck.push("pharisee");
                }
            }

            // 2. Add Good Special Roles
            deck.push("jesus"); // Always add Jesus
            deck.push("luke");  // Always have 1 Healer
            if (count >= 7) deck.push("john"); // Add the Seer for medium groups
            if (count >= 10) deck.push("peter"); // Add the Shield for large groups

            // 3. Fill the rest of the slots with Faithful Disciples
            while (deck.length < count) {
                deck.push("disciple");
            }

            // Shuffle the deck so roles are random
            shuffle(deck);
            currentPlayerIndex = 0;
            prepareLockScreen();
        }

        function prepareLockScreen() {
            if (currentPlayerIndex >= deck.length) {
                switchScreen(endScreen);
                return;
            }

            const playerNum = currentPlayerIndex + 1;
            document.getElementById("lock-text").innerText = `Pass the phone to Player ${playerNum}`;
            document.getElementById("reveal-btn").innerText = `👀 I am Player ${playerNum} (Reveal)`;
            
            switchScreen(lockScreen);
        }

        function showRole() {
            const roleKey = deck[currentPlayerIndex];
            const roleInfo = roleData[roleKey];

            // Update custom image art
            const artEl = document.getElementById("role-art");
            artEl.src = roleInfo.img;
            artEl.alt = roleInfo.title + " Art";
            artEl.className = "role-art " + roleInfo.cssClass; 
            
            const titleEl = document.getElementById("role-title");
            titleEl.innerText = roleInfo.title;
            titleEl.className = "role-title " + roleInfo.cssClass; 
            
            document.getElementById("role-desc").innerText = roleInfo.desc;

            switchScreen(revealScreen);
        }

        function nextPlayer() {
            currentPlayerIndex++;
            prepareLockScreen();
        }
    </script>
</body>
</html>
