<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Vault - Impact Youth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #050505; color: #f8f9fa; line-height: 1.6; 
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
        }
        
        .navbar { background-color: #1c1e21; padding: 12px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;}
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; text-transform: uppercase;}
        .nav-links a:hover { color: #f1c40f; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; width: 100%; text-align: center; display: flex; flex-direction: column; flex-grow: 1;}

        /* The Timer */
        .timer-display { 
            font-size: 6rem; font-weight: 900; color: #e74c3c; font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 30px rgba(231, 76, 60, 0.8); margin-bottom: 20px; line-height: 1; transition: color 0.3s;
        }
        .timer-warning { color: #f1c40f; text-shadow: 0 0 30px rgba(241, 196, 15, 0.8); }

        /* The Vault Door */
        .vault-door {
            background: #1e293b; border: 8px solid #475569; border-radius: 20px; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8);
            padding: 40px; position: relative; display: flex; flex-direction: column; align-items: center;
            transition: transform 0.5s ease-out, border-color 0.5s ease;
        }

        /* The Clues Screen */
        .clues-panel {
            background: #0a0a0a; border: 3px solid #334155; border-radius: 10px; width: 100%;
            padding: 30px; margin-bottom: 30px; text-align: left; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .clue-item { font-size: 1.5rem; color: #cbd5e1; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; align-items: center;}
        .clue-num { font-weight: 900; color: #00a8ff; margin-right: 15px; font-size: 2rem;}
        .clue-hint { color: #2ed573; font-weight: bold; margin-left: 10px; font-size: 1.5rem;}

        /* The Code Input */
        .code-display { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;}
        .code-box { 
            width: 80px; height: 100px; background: #000; border: 4px solid #475569; border-radius: 10px;
            font-size: 4rem; font-weight: 900; color: #f1c40f; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 15px rgba(241, 196, 15, 0.2); font-family: 'Courier New', Courier, monospace;
        }

        /* Tech Guy Controls */
        .controls { display: flex; justify-content: center; gap: 15px; width: 100%; flex-wrap: wrap; background: #111; padding: 20px; border-radius: 15px;}
        .admin-input { padding: 15px; font-size: 2rem; text-align: center; border-radius: 8px; border: 2px solid #333; background: #000; color: white; width: 200px; letter-spacing: 5px; font-weight: bold;}
        .admin-input:focus { outline: none; border-color: #00a8ff; }
        
        .btn { padding: 15px 30px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center;}
        .btn:active { transform: scale(0.95); }
        .btn-submit { background: #00a8ff; } .btn-submit:hover { background: #008ecc; }
        .btn-hint { background: #e74c3c; width: 100%; max-width: 400px; font-size: 1.5rem; border: 3px solid #c0392b;} .btn-hint:hover { background: #c0392b; }
        
        /* Animations */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-5px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
        
        .unlocked { border-color: #2ed573; box-shadow: 0 0 100px rgba(46, 213, 115, 0.6); }

        /* Fullscreen Overlays */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .overlay.active { display: flex; }
        .win-title { font-size: 6rem; color: #2ed573; text-transform: uppercase; letter-spacing: 10px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 50px rgba(46, 213, 115, 0.8);}
        .lose-title { font-size: 6rem; color: #e74c3c; text-transform: uppercase; letter-spacing: 10px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 50px rgba(231, 76, 60, 0.8);}
        
        @media (max-width: 768px) { .timer-display { font-size: 4rem; } .clue-item { font-size: 1.1rem; } .code-box { width: 60px; height: 80px; font-size: 3rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo" onerror="this.style.display='none'"></a>
        <div class="nav-links"><a href="spirit-fun.html">Back to Arcade</a></div>
    </nav>

    <div class="overlay active" id="start-screen">
        <h1 style="font-size: 5rem; color: #f1c40f; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px;">The Digital Vault</h1>
        <p style="color: #cbd5e1; font-size: 1.5rem; margin-bottom: 40px; max-width: 800px;">Solve the 4 clues on the screen to generate the 4-digit code. Need help? Use the hint button, but it will drain 60 seconds from the clock.</p>
        <button class="btn btn-submit" style="font-size: 2rem; padding: 20px 50px;" onclick="startGame()">INITIATE HACK (Start Timer)</button>
    </div>

    <div class="container">
        <div class="timer-display" id="timer">10:00</div>

        <div class="vault-door" id="vault-door">
            
            <div class="clues-panel" id="clues-list">
                </div>

            <div class="code-display">
                <div class="code-box" id="box-0">-</div>
                <div class="code-box" id="box-1">-</div>
                <div class="code-box" id="box-2">-</div>
                <div class="code-box" id="box-3">-</div>
            </div>

            <button class="btn btn-hint" onclick="requestHint()">🚨 USE HINT (-60 SECONDS) 🚨</button>

            <div class="controls" style="margin-top: 40px;">
                <input type="text" id="admin-input" class="admin-input" placeholder="CODE" maxlength="4" autocomplete="off" oninput="updateVisualCode()">
                <button class="btn btn-submit" onclick="checkCode()">SUBMIT CODE</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="win-screen">
        <div class="win-title">VAULT UNLOCKED</div>
        <p style="color: #fff; font-size: 2rem;">The treasure has been secured.</p>
        <button class="btn" style="background: #334155; margin-top: 40px;" onclick="location.reload()">Play Again</button>
    </div>

    <div class="overlay" id="lose-screen">
        <div class="lose-title">SYSTEM LOCKDOWN</div>
        <p style="color: #fff; font-size: 2rem;">Time has expired. Access Denied.</p>
        <button class="btn" style="background: #334155; margin-top: 40px;" onclick="location.reload()">Try Again</button>
    </div>

    <script>
        // --- THE MASTER QUESTION VAULT ---
        // Every question here has an answer from 0 to 9.
        
        const pool1_BibleFacts = [
            { q: "The number of stones David picked up to fight Goliath.", a: 5 },
            { q: "Number of days Jonah was in the belly of the fish.", a: 3 },
            { q: "The number of Gospels in the New Testament.", a: 4 },
            { q: "Days of creation before God rested.", a: 6 },
            { q: "The total number of plagues in Egypt MINUS 3.", a: 7 }
        ];

        const pool2_Mashups = [
            { q: "The number of original Avengers (6) MINUS the Trinity (3).", a: 3 },
            { q: "Infinity Stones (6) PLUS the gifts brought by the Wise Men (3).", a: 9 },
            { q: "Letters in the name 'JESUS'.", a: 5 },
            { q: "Star Wars original trilogy movies (3) PLUS the rivers flowing out of Eden (4).", a: 7 },
            { q: "Letters in the word 'WORSHIP' (7) MINUS letters in 'GOD' (3).", a: 4 }
        ];

        const pool3_Worship = [
            { q: "Hillsong: 'Leaves the __' (Take the first digit of the missing number).", a: 9 },
            { q: "Revelation Song: '___, ___, ___ is the Lord God Almighty' (How many times is it sung?).", a: 3 },
            { q: "Matt Redman: '__,000 Reasons' (How many zeros are in the title?).", a: 4 },
            { q: "Way Maker, Miracle Worker, Promise Keeper, Light in the darkness. (How many titles?).", a: 4 },
            { q: "The number of words in the song title 'Oceans (Where Feet May Fail)'.", a: 5 }
        ];

        const pool4_ActionLogic = [
            { q: "Number of Disciples (12) MINUS the Ten Commandments (10).", a: 2 },
            { q: "Tribes of Israel (12) DIVIDED by the number of Gospel writers (4).", a: 3 },
            { q: "The animals went into Noah's Ark by ___s.", a: 2 },
            { q: "The total number of testaments in the Bible.", a: 2 },
            { q: "Number of days Jesus fasted in the wilderness (40). Take the first digit.", a: 4 }
        ];

        // --- GAME STATE ---
        let targetCode = [];
        let timeLeft = 600; // 10 minutes in seconds
        let timerInterval;
        let revealedHints = [false, false, false, false];

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            
            // 1. Pick 1 random question from each pool
            const q1 = pool1_BibleFacts[Math.floor(Math.random() * pool1_BibleFacts.length)];
            const q2 = pool2_Mashups[Math.floor(Math.random() * pool2_Mashups.length)];
            const q3 = pool3_Worship[Math.floor(Math.random() * pool3_Worship.length)];
            const q4 = pool4_ActionLogic[Math.floor(Math.random() * pool4_ActionLogic.length)];

            // 2. Set the target code
            targetCode = [q1.a, q2.a, q3.a, q4.a];

            // 3. Render the clues to the screen
            const cluesHtml = `
                <div class="clue-item"><span class="clue-num">1.</span> ${q1.q} <span class="clue-hint" id="hint-0"></span></div>
                <div class="clue-item"><span class="clue-num">2.</span> ${q2.q} <span class="clue-hint" id="hint-1"></span></div>
                <div class="clue-item"><span class="clue-num">3.</span> ${q3.q} <span class="clue-hint" id="hint-2"></span></div>
                <div class="clue-item"><span class="clue-num">4.</span> ${q4.q} <span class="clue-hint" id="hint-3"></span></div>
            `;
            document.getElementById('clues-list').innerHTML = cluesHtml;

            // 4. Start the clock
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('admin-input').focus();
        }

        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00";
                document.getElementById('lose-screen').classList.add('active');
                return;
            }

            timeLeft--;
            
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;
            
            const timerObj = document.getElementById('timer');
            timerObj.innerText = `${minutes}:${seconds}`;

            // Make it red and scary at 60 seconds
            if (timeLeft <= 60) {
                timerObj.style.color = "#e74c3c";
            }
        }

        // Live updates the big visual boxes as you type
        function updateVisualCode() {
            const input = document.getElementById('admin-input').value;
            for (let i = 0; i < 4; i++) {
                const box = document.getElementById(`box-${i}`);
                if (input[i]) {
                    box.innerText = input[i];
                    box.style.color = "#fff";
                } else {
                    box.innerText = "-";
                    box.style.color = "#f1c40f";
                }
            }
        }

        function checkCode() {
            const guess = document.getElementById('admin-input').value;
            const correctString = targetCode.join("");

            if (guess === correctString) {
                // WIN!
                clearInterval(timerInterval);
                document.getElementById('vault-door').classList.add('unlocked');
                setTimeout(() => {
                    document.getElementById('win-screen').classList.add('active');
                }, 1000);
            } else {
                // LOSE! Shake the vault and turn red.
                const vault = document.getElementById('vault-door');
                vault.style.borderColor = "#e74c3c";
                vault.classList.add('shake');
                
                // Play a system beep/buzz mentally
                document.getElementById('admin-input').value = "";
                updateVisualCode();

                setTimeout(() => {
                    vault.classList.remove('shake');
                    vault.style.borderColor = "#475569";
                }, 500);
            }
        }

        function requestHint() {
            // Find which digits haven't been revealed yet
            let availableIndexes = [];
            for (let i = 0; i < 4; i++) {
                if (!revealedHints[i]) availableIndexes.push(i);
            }

            if (availableIndexes.length === 0) {
                alert("All hints have already been revealed!");
                return;
            }

            // Confirm they want to lose 60 seconds
            if (confirm("WARNING: Using a hint will instantly subtract 60 seconds from the timer. Proceed?")) {
                // Subtract time
                timeLeft -= 60;
                if (timeLeft < 0) timeLeft = 0;
                updateTimer();

                // Pick a random unrevealed digit
                const randomIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
                revealedHints[randomIndex] = true;

                // Show it on the screen
                document.getElementById(`hint-${randomIndex}`).innerText = `[ Answer: ${targetCode[randomIndex]} ]`;
            }
        }

        // Allow pressing "Enter" to submit code
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("admin-input").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    checkCode();
                }
            });
        });
    </script>
</body>
</html>
