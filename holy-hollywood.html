<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Holy or Hollywood">
    <title>Holy or Hollywood - Impact Youth Amman</title>
    <style>
        /* 1. Global Reset & Professional Background */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: url('background.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center; 
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        
        /* 2. Navigation Bar */
        .navbar { 
            background-color: #1c1e21; 
            padding: 10px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
            position: sticky; top: 0; z-index: 100;
        }
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 1rem; }
        .login-btn { background-color: #00a8ff; padding: 8px 20px; border-radius: 5px; color: white !important; margin-left: 20px; font-weight: bold; }

        /* 3. Header Styling */
        .header-title { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(rgba(28, 30, 33, 0.7), rgba(28, 30, 33, 0.95)); 
            border-bottom: 1px solid #333;
        }
        .header-title h1 { 
            font-size: 3.5rem; 
            color: #f39c12; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        /* 4. Game Card & Quote Box */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .game-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px 40px; 
            border-radius: 18px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            color: #1e293b; 
            border-top: 10px solid #f39c12;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        #progress-bar { font-weight: bold; color: #64748b; margin-bottom: 15px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }

        .quote-box { 
            font-size: 2.2rem; 
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 700; 
            margin-bottom: 35px; 
            color: #0f172a; 
            line-height: 1.3;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 5. Action Buttons */
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .btn-choice { 
            padding: 22px; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.4rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            color: white; 
            text-transform: uppercase;
        }
        .btn-bible { background: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3); }
        .btn-movie { background: #9b59b6; box-shadow: 0 5px 15px rgba(155, 89, 182, 0.3); }
        .btn-choice:hover { transform: translateY(-5px); filter: brightness(1.1); }

        .btn-util { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #475569; }

        /* 6. Feedback & Reference Display */
        .feedback { font-size: 1.4rem; font-weight: bold; margin-top: 20px; }
        .reference-text { 
            display: block; 
            font-size: 1.1rem; 
            color: #64748b; 
            margin-top: 5px; 
            font-weight: normal; 
            font-family: 'Segoe UI', sans-serif; 
            font-style: normal;
        }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        @media (max-width: 768px) { 
            .navbar { padding: 10px 20px; } .nav-links { display: none; }
            .header-title h1 { font-size: 2.2rem; }
            .quote-box { font-size: 1.6rem; }
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    
    <div class="header-title">
        <h1>Holy or Hollywood?</h1>
    </div>
    
    <div class="container">
        <div class="game-card">
            <div id="progress-bar">Quote 1 / 50</div>
            <div class="quote-box" id="quote-display">"Ready to play?"</div>
            
            <div class="choice-grid">
                <button class="btn-choice btn-bible" onclick="checkAnswer('bible')">📖 Bible</button>
                <button class="btn-choice btn-movie" onclick="checkAnswer('movie')">🎬 Movie</button>
            </div>
            
            <button class="btn-util" onclick="nextQuote()">⏭️ Skip Question</button>

            <div class="feedback" id="feedback-msg"></div>
        </div>
    </div>

    <script>
        // EXPANDED LIBRARY: 50 QUOTES WITH REFERENCES
        const library = [
            { q: "Love is patient, love is kind.", a: "bible", ref: "1 Corinthians 13:4" },
            { q: "I'm going to make him an offer he can't refuse.", a: "movie", ref: "The Godfather (1972)" },
            { q: "In the beginning, God created the heavens and the earth.", a: "bible", ref: "Genesis 1:1" },
            { q: "May the Force be with you.", a: "movie", ref: "Star Wars" },
            { q: "The Lord is my shepherd; I shall not want.", a: "bible", ref: "Psalm 23:1" },
            { q: "There's no place like home.", a: "movie", ref: "The Wizard of Oz" },
            { q: "For everything there is a season.", a: "bible", ref: "Ecclesiastes 3:1" },
            { q: "Keep your friends close, but your enemies closer.", a: "movie", ref: "The Godfather Part II" },
            { q: "Ask and it will be given to you.", a: "bible", ref: "Matthew 7:7" },
            { q: "I'll be back.", a: "movie", ref: "The Terminator" },
            { q: "Jesus wept.", a: "bible", ref: "John 11:35" },
            { q: "You're gonna need a bigger boat.", a: "movie", ref: "Jaws" },
            { q: "Faith is the substance of things hoped for.", a: "bible", ref: "Hebrews 11:1" },
            { q: "To infinity and beyond!", a: "movie", ref: "Toy Story" },
            { q: "I am the way, the truth, and the life.", a: "bible", ref: "John 14:6" },
            { q: "Why so serious?", a: "movie", ref: "The Dark Knight" },
            { q: "Blessed are the peacemakers.", a: "bible", ref: "Matthew 5:9" },
            { q: "Iron sharpens iron.", a: "bible", ref: "Proverbs 27:17" },
            { q: "Life is like a box of chocolates.", a: "movie", ref: "Forrest Gump" },
            { q: "A house divided against itself cannot stand.", a: "bible", ref: "Mark 3:25" },
            { q: "I am your father.", a: "movie", ref: "Star Wars: Empire Strikes Back" },
            { q: "Vengeance is mine, says the Lord.", a: "bible", ref: "Romans 12:19" },
            { q: "The truth will set you free.", a: "bible", ref: "John 8:32" },
            { q: "Houston, we have a problem.", a: "movie", ref: "Apollo 13" },
            { q: "Wait for the Lord; be strong.", a: "bible", ref: "Psalm 27:14" },
            { q: "You can't handle the truth!", a: "movie", ref: "A Few Good Men" },
            { q: "Be still and know that I am God.", a: "bible", ref: "Psalm 46:10" },
            { q: "My precious.", a: "movie", ref: "Lord of the Rings" },
            { q: "A friend loves at all times.", a: "bible", ref: "Proverbs 17:17" },
            { q: "Show me the money!", a: "movie", ref: "Jerry Maguire" },
            { q: "Pride goes before destruction.", a: "bible", ref: "Proverbs 16:18" },
            { q: "Here's looking at you, kid.", a: "movie", ref: "Casablanca" },
            { q: "The love of money is the root of all evil.", a: "bible", ref: "1 Timothy 6:10" },
            { q: "Bond. James Bond.", a: "movie", ref: "Dr. No" },
            { q: "I can do all things through Christ.", a: "bible", ref: "Philippians 4:13" },
            { q: "E.T. phone home.", a: "movie", ref: "E.T. the Extra-Terrestrial" },
            { q: "Peace I leave with you.", a: "bible", ref: "John 14:27" },
            { q: "I see dead people.", a: "movie", ref: "The Sixth Sense" },
            { q: "Do not be overcome by evil.", a: "bible", ref: "Romans 12:21" },
            { q: "Just keep swimming.", a: "movie", ref: "Finding Nemo" },
            { q: "Be kind to one another.", a: "bible", ref: "Ephesians 4:32" },
            { q: "You had me at hello.", a: "movie", ref: "Jerry Maguire" },
            { q: "Greater love has no one than this.", a: "bible", ref: "John 15:13" },
            { q: "Carpe diem. Seize the day.", a: "movie", ref: "Dead Poets Society" },
            { q: "Let your light shine before others.", a: "bible", ref: "Matthew 5:16" },
            { q: "May the odds be ever in your favor.", a: "movie", ref: "The Hunger Games" },
            { q: "I'm the king of the world!", a: "movie", ref: "Titanic" },
            { q: "Rejoice always.", a: "bible", ref: "1 Thessalonians 5:16" },
            { q: "With great power comes great responsibility.", a: "movie", ref: "Spider-Man" },
            { q: "God is our refuge and strength.", a: "bible", ref: "Psalm 46:1" }
        ];

        let currentIdx = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuote() {
            if (currentIdx >= library.length) {
                alert("🏆 Epic! You cleared all 50. Reshuffling...");
                currentIdx = 0;
                shuffle(library);
            }
            document.getElementById("progress-bar").innerText = `Quote ${currentIdx + 1} / 50`;
            document.getElementById("quote-display").innerText = `"${library[currentIdx].q}"`;
            document.getElementById("feedback-msg").innerHTML = "";
        }

        function checkAnswer(choice) {
            const item = library[currentIdx];
            const isCorrect = (choice === item.a);
            
            if (isCorrect) {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="correct">✅ CORRECT!</span><br><span class="reference-text">Source: ${item.ref}</span>`;
            } else {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="wrong">❌ WRONG! That was ${item.a.toUpperCase()}.</span><br><span class="reference-text">Source: ${item.ref}</span>`;
            }

            currentIdx++;
            // Longer delay so they can read the reference
            setTimeout(loadQuote, 2500);
        }

        function nextQuote() { currentIdx++; loadQuote(); }

        shuffle(library);
        loadQuote();
    </script>
</body>
</html>s
