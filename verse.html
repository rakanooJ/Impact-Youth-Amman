            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            color: #1e293b; 
        }
        
        .game-card h2 { color: #00a8ff; font-size: 2rem; margin-bottom: 20px; border-bottom: 2px dashed #ccc; padding-bottom: 10px; }
        
        .verse-text { font-size: 1.6rem; line-height: 2.2; font-weight: 500; color: #333; }
        
        .start-btn {
            background: #00a8ff;
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 30px;
        }
        .start-btn:hover { background: #008ecc; transform: scale(1.05); }
        
        .word-input {
            width: 140px; 
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 5px;
            margin: 0 5px;
            border: 3px solid #cbd5e1;
            border-radius: 8px;
            color: #1e293b;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .word-input:focus { border-color: #00a8ff; box-shadow: 0 0 8px rgba(0, 168, 255, 0.5); }
        
        .word-input.correct {
            border-color: #2ed573;
            background: #e8f8f5;
            color: #27ae60;
            pointer-events: none; 
        }
        
        #success-msg {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #2ed573;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            animation: popIn 0.5s ease-out forwards;
        }

        #game-area { display: none; }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .verse-text { font-size: 1.3rem; } .word-input { width: 100px; font-size: 1.1rem; } }
