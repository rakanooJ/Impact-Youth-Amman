<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy or Hollywood: Expert Edition</title>
    <style>
        /* 1. Global Reset & Professional HTU/Impact Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-image: url('background.png'); 
            background-size: cover; background-attachment: fixed; background-position: center;
            background-color: #1c1e21; color: #f8f9fa; line-height: 1.6; 
        }
        
        /* 2. Pro Navigation */
        .navbar { 
            background-color: #1c1e21; padding: 12px 60px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333; 
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 1rem; }
        .login-btn { background-color: #00a8ff; padding: 10px 22px; border-radius: 6px; color: white !important; margin-left: 20px; font-weight: bold; }

        /* 3. Header */
        .header-title { text-align: center; padding: 60px 20px; background: rgba(28, 30, 33, 0.85); border-bottom: 1px solid #333; }
        .header-title h1 { font-size: 3.5rem; color: #f39c12; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        /* 4. Game Interface */
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .game-card { 
            background: rgba(255, 255, 255, 0.96); padding: 55px 45px; border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); color: #1e293b; border-top: 12px solid #f39c12;
            min-height: 520px; display: flex; flex-direction: column; justify-content: center;
        }
        
        #progress-counter { font-weight: 800; color: #64748b; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; }

        .quote-box { 
            font-size: 2.3rem; font-family: 'Georgia', serif; font-style: italic; font-weight: 700; 
            margin-bottom: 40px; color: #0f172a; line-height: 1.35; min-height: 160px;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* 5. Choice Buttons */
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .btn-choice { 
            padding: 24px; border: none; border-radius: 12px; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: white; text-transform: uppercase;
        }
        .btn-bible { background: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3); }
        .btn-movie { background: #9b59b6; box-shadow: 0 5px 15px rgba(155, 89, 182, 0.3); }
        .btn-choice:hover { transform: translateY(-6px); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .btn-skip { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #475569; }

        /* 6. Feedback & Reveal */
        .feedback { font-size: 1.6rem; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        .reference-box { display: block; font-size: 1.2rem; color: #475569; margin-top: 8px; font-weight: 600; font-family: 'Segoe UI', sans-serif; font-style: normal; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .header-title h1 { font-size: 2rem; } .quote-box { font-size: 1.5rem; } .choice-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="spirit-fun.html">Back to Fun</a>
            <a href="connect.html">Connect</a>
        </div>
    </nav>
    
    <div class="header-title"><h1>Holy or Hollywood?</h1><p style="color:#cbd5e1">Expert Difficulty</p></div>
    
    <div class="container">
        <div class="game-card">
            <div id="progress-counter">Quote 1 / 65</div>
            <div class="quote-box" id="quote-display">"Loading the challenge..."</div>
            
            <div class="choice-grid">
                <button class="btn-choice btn-bible" onclick="checkAnswer('bible')">📖 Bible</button>
                <button class="btn-choice btn-movie" onclick="checkAnswer('movie')">🎬 Movie</button>
            </div>
            
            <button class="btn-skip" onclick="nextQuote()">Skip to next</button>
            <div class="feedback" id="feedback-msg"></div>
        </div>
    </div>

    <script>
        // EXPERT LIBRARY: 65 AMBIGUOUS QUOTES
        const library = [
            // TRICKY BIBLE
            { q: "I have escaped by the skin of my teeth.", a: "bible", ref: "Job 19:20" },
            { q: "Deep calls to deep at the roar of your waterfalls.", a: "bible", ref: "Psalm 42:7" },
            { q: "The heart is deceitful above all things.", a: "bible", ref: "Jeremiah 17:9" },
            { q: "I am a brother to dragons and a companion to owls.", a: "bible", ref: "Job 30:29" },
            { q: "Vanity of vanities, all is vanity.", a: "bible", ref: "Ecclesiastes 1:2" },
            { q: "A man's enemies are the men of his own house.", a: "bible", ref: "Micah 7:6" },
            { q: "For they have sown the wind, and they shall reap the whirlwind.", a: "bible", ref: "Hosea 8:7" },
            { q: "He who digs a pit will fall into it.", a: "bible", ref: "Proverbs 26:27" },
            { q: "The sun also rises, and the sun goes down.", a: "bible", ref: "Ecclesiastes 1:5" },
            { q: "A righteous man falls seven times, and rises again.", a: "bible", ref: "Proverbs 24:16" },
            { q: "Even in laughter the heart may ache.", a: "bible", ref: "Proverbs 14:13" },
            { q: "The words of a talebearer are as wounds.", a: "bible", ref: "Proverbs 18:8" },
            { q: "I will make your name great, and you will be a blessing.", a: "bible", ref: "Genesis 12:2" },
            { q: "The light shines in the darkness, and the darkness has not overcome it.", a: "bible", ref: "John 1:5" },
            { q: "What has been is what will be, and what has been done is what will be done.", a: "bible", ref: "Ecclesiastes 1:9" },
            { q: "Can a man take fire in his bosom, and his clothes not be burned?", a: "bible", ref: "Proverbs 6:27" },
            { q: "Woe to those who call evil good and good evil.", a: "bible", ref: "Isaiah 5:20" },
            { q: "The heavens declare the glory of God; the skies proclaim the work of his hands.", a: "bible", ref: "Psalm 19:1" },
            { q: "A soft answer turns away wrath.", a: "bible", ref: "Proverbs 15:1" },
            { q: "The earth is the Lord's, and everything in it.", a: "bible", ref: "Psalm 24:1" },
            { q: "I have fought the good fight, I have finished the race.", a: "bible", ref: "2 Timothy 4:7" },
            { q: "Love never fails.", a: "bible", ref: "1 Corinthians 13:8" },
            { q: "The fear of the Lord is the beginning of wisdom.", a: "bible", ref: "Psalm 111:10" },
            { q: "I can do all things through Christ who strengthens me.", a: "bible", ref: "Philippians 4:13" },
            { q: "As iron sharpens iron, so one person sharpens another.", a: "bible", ref: "Proverbs 27:17" },
            { q: "Be strong and courageous. Do not be afraid.", a: "bible", ref: "Joshua 1:9" },
            { q: "God is our refuge and strength, an ever-present help in trouble.", a: "bible", ref: "Psalm 46:1" },
            { q: "For I know the plans I have for you.", a: "bible", ref: "Jeremiah 29:11" },
            { q: "The grass withers and the flowers fall, but the word of our God endures forever.", a: "bible", ref: "Isaiah 40:8" },
            { q: "He leads me beside quiet waters.", a: "bible", ref: "Psalm 23:2" },
            { q: "The Lord will fight for you; you need only to be still.", a: "bible", ref: "Exodus 14:14" },
            { q: "I am the way, the truth, and the life.", a: "bible", ref: "John 14:6" },
            { q: "Trust in the Lord with all your heart.", a: "bible", ref: "Proverbs 3:5" },

            // TRICKY MOVIE
            { q: "All we have to decide is what to do with the time that is given us.", a: "movie", ref: "Lord of the Rings (Gandalf)" },
            { q: "It is not our abilities that show what we truly are… it is our choices.", a: "movie", ref: "Harry Potter (Dumbledore)" },
            { q: "What we do in life echoes in eternity.", a: "movie", ref: "Gladiator (Maximus)" },
            { q: "The world is changed. I feel it in the water. I feel it in the earth.", a: "movie", ref: "Lord of the Rings (Galadriel)" },
            { q: "Hope is a good thing, maybe the best of things.", a: "movie", ref: "The Shawshank Redemption" },
            { q: "Death is just another path, one that we all must take.", a: "movie", ref: "Lord of the Rings" },
            { q: "Mercy is not something that you give. It's something that you earn.", a: "movie", ref: "Man of Steel" },
            { q: "Your eyes can deceive you; don't trust them.", a: "movie", ref: "Star Wars (Obi-Wan)" },
            { q: "Great men are not born great, they grow great.", a: "movie", ref: "The Godfather" },
            { q: "Even the smallest person can change the course of the future.", a: "movie", ref: "Lord of the Rings" },
            { q: "I would rather have a life with you than all the ages of the world alone.", a: "movie", ref: "Lord of the Rings (Arwen)" },
            { q: "Do or do not. There is no try.", a: "movie", ref: "The Empire Strikes Back (Yoda)" },
            { q: "With great power comes great responsibility.", a: "movie", ref: "Spider-Man" },
            { q: "I'm the king of the world!", a: "movie", ref: "Titanic" },
            { q: "May the Force be with you.", a: "movie", ref: "Star Wars" },
            { q: "I'll be back.", a: "movie", ref: "The Terminator" },
            { q: "You're gonna need a bigger boat.", a: "movie", ref: "Jaws" },
            { q: "There's no place like home.", a: "movie", ref: "The Wizard of Oz" },
            { q: "Life is like a box of chocolates.", a: "movie", ref: "Forrest Gump" },
            { q: "Houston, we have a problem.", a: "movie", ref: "Apollo 13" },
            { q: "You had me at hello.", a: "movie", ref: "Jerry Maguire" },
            { q: "I'm going to make him an offer he can't refuse.", a: "movie", ref: "The Godfather" },
            { q: "Carpe diem. Seize the day, boys.", a: "movie", ref: "Dead Poets Society" },
            { q: "I see dead people.", a: "movie", ref: "The Sixth Sense" },
            { q: "Bond. James Bond.", a: "movie", ref: "Dr. No" },
            { q: "To infinity and beyond!", a: "movie", ref: "Toy Story" },
            { q: "Why so serious?", a: "movie", ref: "The Dark Knight" },
            { q: "Keep your friends close, but your enemies closer.", a: "movie", ref: "The Godfather Part II" },
            { q: "Here's looking at you, kid.", a: "movie", ref: "Casablanca" },
            { q: "I'm the one who knocks!", a: "movie", ref: "Breaking Bad" },
            { q: "Say hello to my little friend!", a: "movie", ref: "Scarface" },
            { q: "Hasta la vista, baby.", a: "movie", ref: "Terminator 2" }
        ];

        let currentIdx = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuote() {
            if (currentIdx >= library.length) {
                alert("🏆 Epic Achievement! You cleared the Expert set. Reshuffling...");
                currentIdx = 0; shuffle(library);
            }
            document.getElementById("progress-counter").innerText = `Quote ${currentIdx + 1} / 65`;
            document.getElementById("quote-display").innerText = `"${library[currentIdx].q}"`;
            document.getElementById("feedback-msg").innerHTML = "";
        }

        function checkAnswer(choice) {
            const item = library[currentIdx];
            const isCorrect = (choice === item.a);
            
            if (isCorrect) {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="correct">✅ Correct Decision!</span><br><span class="reference-box">Ref: ${item.ref}</span>`;
            } else {
                document.getElementById("feedback-msg").innerHTML = 
                    `<span class="wrong">❌ Misjudged! It's ${item.a.toUpperCase()}.</span><br><span class="reference-box">Ref: ${item.ref}</span>`;
            }
            currentIdx++;
            setTimeout(loadQuote, 2400); // Wait long enough to read the ref
        }

        function nextQuote() { currentIdx++; loadQuote(); }

        shuffle(library);
        loadQuote();
    </script>
</body>
</html>
