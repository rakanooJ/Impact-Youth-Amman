<script>
        // --- 1. COUNTDOWN SCRIPT ---
        function updateCountdown() {
            const now = new Date();
            let nextWednesday = new Date();
            nextWednesday.setDate(now.getDate() + (3 + 7 - now.getDay()) % 7);
            nextWednesday.setHours(19, 0, 0, 0);
            if (now > nextWednesday) nextWednesday.setDate(nextWednesday.getDate() + 7);
            const diff = nextWednesday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / 1000 / 60) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById("countdown").innerHTML = (now.getDay() === 3 && now.getHours() >= 19 && now.getHours() < 21) ? "WE ARE LIVE! 🔥" : `${days}d ${hours}h ${mins}m ${secs}s`;
        }
        setInterval(updateCountdown, 1000); updateCountdown();

        // --- 2. BIBLE FRIEND AI SCRIPT ---
        
        // PASTE YOUR GROQ API KEY HERE FOR LOCAL TESTING
        // (Remember to delete it again before pushing to a public GitHub!)
        const GROQ_API_KEY = "";
        
        const modal = document.getElementById('aiModal');
        const statusEl = document.getElementById('ai-status');
        const talkBtn = document.getElementById('ai-talk-btn');
        const convEl = document.getElementById('ai-conversation');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const synth = window.speechSynthesis;
        recognition.continuous = false;

        // Load premium voices in the background
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => {
            availableVoices = window.speechSynthesis.getVoices();
        };

        function openAI() { modal.style.display = 'flex'; }
        function closeAI() { 
            modal.style.display = 'none'; 
            synth.cancel(); 
        }

        talkBtn.onclick = () => {
            recognition.start();
            statusEl.textContent = "Listening... Speak now!";
            talkBtn.disabled = true;
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            appendMessage("You", transcript, "user");
            statusEl.textContent = "Consulting the Word...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: [
                            { 
                                role: "system", 
                                // NEW: Forcing the AI to use your exact structure
                                content: `You are Bible Friend, a comforting youth group guide. 
                                If asked to explain a Bible verse, you MUST format your answer exactly like this:
                                
                                Verse: [Quote the verse]
                                Context: [Brief background]
                                Meaning: [Explain it clearly]
                                Life Lesson: [How to apply it today]
                                
                                Keep it brief and spoken-word friendly. Do not use asterisks or markdown formatting.` 
                            },
                            { role: "user", content: transcript }
                        ]
                    })
                });

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                appendMessage("Bible Friend", aiResponse, "ai");
                speakText(aiResponse);
            } catch(e) {
                appendMessage("System", "Sorry, I had trouble reaching the cloud.", "ai");
                console.error(e);
            }
            
            statusEl.textContent = "System Online. Ready to listen!";
            talkBtn.disabled = false;
        };

        // NEW: Upgraded voice function for smoother audio
        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95; 
            utterance.pitch = 1.0; 

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            const smoothVoice = availableVoices.find(voice => 
                voice.name.includes("Google") || 
                voice.name.includes("Premium") || 
                voice.name.includes("Natural") ||
                voice.name.includes("Samantha")
            );

            if (smoothVoice) {
                utterance.voice = smoothVoice;
            }

            synth.speak(utterance);
        }

        // NEW: Upgraded message function to handle line breaks properly
        function appendMessage(sender, text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            
            // Converts the AI's hidden 'Enters' into visual line breaks on the website
            const formattedText = text.replace(/\n/g, '<br>');
            
            div.innerHTML = `<strong style="color: ${className === 'user' ? '#00a8ff' : '#2ed573'};">${sender}:</strong><br><br>${formattedText}`;
            convEl.appendChild(div);
            convEl.scrollTop = convEl.scrollHeight; 
        }
    </script>
