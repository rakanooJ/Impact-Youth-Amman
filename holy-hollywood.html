<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy or Hollywood - Impact Youth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; color: #f8f9fa; line-height: 1.6; 
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        .navbar { background-color: #1c1e21; padding: 12px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;}
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; text-transform: uppercase;}
        .nav-links a:hover { color: #f1c40f; }

        .game-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; width: 100%; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: center;}

        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 2.5rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; margin: 0;}
        
        .stats-box { display: flex; gap: 20px; background: #111; padding: 10px 20px; border-radius: 10px; border: 2px solid #333;}
        .stat { font-size: 1.2rem; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .stat-val { color: #f1c40f; font-size: 1.5rem; }

        /* The Presentation Card */
        .quote-card { 
            background: #111; padding: 50px 40px; border-radius: 20px; 
            border: 2px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px; position: relative; min-height: 350px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .quote-text { font-size: 2.8rem; font-weight: 900; color: #fff; line-height: 1.3; font-style: italic; margin-bottom: 30px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);}
        .quote-marks { color: #475569; font-size: 4rem; position: absolute; top: 20px; left: 30px; opacity: 0.5;}

        /* The Reveal Section */
        .reveal-box { display: none; width: 100%; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px;}
        .result-text { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,0,0,0.5);}
        .source-text { font-size: 1.6rem; color: #cbd5e1; font-weight: bold; line-height: 1.4;}
        .actual-answer { color: #f8f9fa; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 5px; border-bottom: 2px solid #475569; padding-bottom: 10px; display: inline-block;}

        /* Controls */
        .controls { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 800px; margin: 0 auto;}
        .btn { padding: 20px; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: #fff; flex: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.4);}
        .btn:active { transform: scale(0.95); }
        
        .btn-holy { background: #f1c40f; color: #000; }
        .btn-holy:hover { background: #d4ac0d; }
        
        .btn-hollywood { background: #e74c3c; }
        .btn-hollywood:hover { background: #c0392b; }
        
        .btn-skip { background: transparent; border: 2px solid #475569; color: #94a3b8; font-size: 1.2rem; margin-top: 20px; max-width: 300px; padding: 15px; box-shadow: none;}
        .btn-skip:hover { background: #334155; color: #fff; }
        
        .btn-next { background: #2ed573; color: #000; width: 100%; max-width: 400px;}
        .btn-next:hover { background: #27ae60; }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        @media (max-width: 768px) { .header-info { flex-direction: column; gap: 15px;} .quote-text { font-size: 1.8rem; } .result-text { font-size: 2.5rem; } .controls { flex-direction: column; } .navbar { padding: 10px 20px; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo" onerror="this.style.display='none'"></a>
        <div class="nav-links"><a href="spirit-fun.html">Back to Arcade</a></div>
    </nav>

    <div class="game-container">
        <div class="header-info">
            <h1 class="title">Holy or Hollywood?</h1>
            <div class="stats-box">
                <div class="stat">Q: <span class="stat-val" id="question-counter">1/40</span></div>
                <div class="stat">Score: <span class="stat-val" id="score-counter">0</span></div>
            </div>
        </div>

        <div class="quote-card">
            <div class="quote-marks">"</div>
            <div class="quote-text" id="quote-text">Loading quote...</div>
            
            <div class="reveal-box" id="reveal-box">
                <div class="result-text" id="result-text">CORRECT</div>
                <div class="actual-answer" id="actual-answer">It was HOLLYWOOD</div>
                <div class="source-text" id="source-text">Source: The Lord of the Rings</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="controls" id="choice-buttons">
                <button class="btn btn-holy" onclick="makeGuess('Holy')">📖 Holy</button>
                <button class="btn btn-hollywood" onclick="makeGuess('Hollywood')">🎬 Hollywood</button>
            </div>
            <button class="btn btn-skip" id="btn-skip" onclick="skipQuestion()">⏭️ Skip Quote</button>
        </div>

        <div class="controls" id="next-button-container" style="display: none; margin-top: 20px;">
            <button class="btn btn-next" onclick="nextQuestion()">Next Quote ⏭️</button>
        </div>
    </div>

    <script>
        const originalVault = [
            // --- THE HARDCORE HOLLYWOOD QUOTES (Sound like Scripture) ---
            { text: "What we do in life echoes in eternity.", answer: "Hollywood", source: "Gladiator" },
            { text: "Many that live deserve death. And some that die deserve life. Can you give it to them?", answer: "Hollywood", source: "The Lord of the Rings" },
            { text: "Fear is the path to the dark side. Fear leads to anger; anger leads to hate; hate leads to suffering.", answer: "Hollywood", source: "Star Wars" },
            { text: "There is no good and evil, there is only power and those too weak to seek it.", answer: "Hollywood", source: "Harry Potter" },
            { text: "To love another person is to see the face of God.", answer: "Hollywood", source: "Les Misérables" },
            { text: "The night is darkest just before the dawn.", answer: "Hollywood", source: "The Dark Knight" },
            { text: "It is what you do right now that makes a difference.", answer: "Hollywood", source: "Black Hawk Down" },
            { text: "Some birds aren't meant to be caged. Their feathers are just too bright.", answer: "Hollywood", source: "The Shawshank Redemption" },
            { text: "We are who we choose to be.", answer: "Hollywood", source: "Spider-Man" },
            { text: "A heart is not judged by how much you love, but by how much you are loved by others.", answer: "Hollywood", source: "The Wizard of Oz" },
            { text: "Hope is a good thing, maybe the best of things, and no good thing ever dies.", answer: "Hollywood", source: "The Shawshank Redemption" },
            { text: "It is not our abilities that show what we truly are… it is our choices.", answer: "Hollywood", source: "Harry Potter" },
            { text: "Death is just another path, one that we all must take.", answer: "Hollywood", source: "The Lord of the Rings" },
            { text: "Great men are not born great, they grow great.", answer: "Hollywood", source: "The Godfather" },
            { text: "Every man dies, not every man really lives.", answer: "Hollywood", source: "Braveheart" },
            { text: "There is no certainty, only opportunity.", answer: "Hollywood", source: "V for Vendetta" },
            { text: "Why do we fall? So we can learn to pick ourselves up.", answer: "Hollywood", source: "Batman Begins" },
            { text: "I am the master of my fate, I am the captain of my soul.", answer: "Hollywood", source: "Invictus" },
            { text: "All we have to decide is what to do with the time that is given to us.", answer: "Hollywood", source: "The Lord of the Rings" },
            { text: "Love is the one thing we're capable of perceiving that transcends dimensions of time and space.", answer: "Hollywood", source: "Interstellar" },

            // --- THE HARDCORE BIBLE QUOTES (Sound like Action Movies/Fantasy) ---
            { text: "I will make your oppressors eat their own flesh; they will be drunk on their own blood.", answer: "Holy", source: "Isaiah 49:26" },
            { text: "Their arrows are sharp, all their bows are strung; their horses' hooves seem like flint.", answer: "Holy", source: "Isaiah 5:28" },
            { text: "Do not be overcome by evil, but overcome evil with good.", answer: "Holy", source: "Romans 12:21" },
            { text: "Let the weak say, 'I am a warrior!'", answer: "Holy", source: "Joel 3:10" },
            { text: "The nations were angry, and your wrath has come.", answer: "Holy", source: "Revelation 11:18" },
            { text: "I came to cast fire on the earth, and would that it were already kindled!", answer: "Holy", source: "Luke 12:49" },
            { text: "Deep calls to deep in the roar of your waterfalls.", answer: "Holy", source: "Psalm 42:7" },
            { text: "Out of the eater came something to eat, and out of the strong came something sweet.", answer: "Holy", source: "Judges 14:14" },
            { text: "He trains my hands for war, so that my arms can bend a bow of bronze.", answer: "Holy", source: "Psalm 18:34" },
            { text: "Can a man take fire to his bosom, and his clothes not be burned?", answer: "Holy", source: "Proverbs 6:27" },
            { text: "For they sow the wind, and they shall reap the whirlwind.", answer: "Holy", source: "Hosea 8:7" },
            { text: "A living dog is better than a dead lion.", answer: "Holy", source: "Ecclesiastes 9:4" },
            { text: "The wicked flee when no one pursues, but the righteous are bold as a lion.", answer: "Holy", source: "Proverbs 28:1" },
            { text: "He who digs a pit will fall into it.", answer: "Holy", source: "Proverbs 26:27" },
            { text: "Can two walk together, unless they are agreed?", answer: "Holy", source: "Amos 3:3" },
            { text: "There is nothing new under the sun.", answer: "Holy", source: "Ecclesiastes 1:9" },
            { text: "The race is not to the swift, nor the battle to the strong.", answer: "Holy", source: "Ecclesiastes 9:11" },
            { text: "Love is strong as death, jealousy is fierce as the grave.", answer: "Holy", source: "Song of Solomon 8:6" },
            { text: "Many waters cannot quench love, neither can floods drown it.", answer: "Holy", source: "Song of Solomon 8:7" },
            { text: "If I make my bed in the depths, you are there.", answer: "Holy", source: "Psalm 139:8" }
        ];

        let gameDeck = [];
        let currentIndex = 0;
        let score = 0;

        const quoteTextEl = document.getElementById("quote-text");
        const revealBoxEl = document.getElementById("reveal-box");
        const resultTextEl = document.getElementById("result-text");
        const actualAnswerEl = document.getElementById("actual-answer");
        const sourceTextEl = document.getElementById("source-text");
        
        const choiceButtonsEl = document.getElementById("choice-buttons");
        const btnSkip = document.getElementById("btn-skip");
        const nextButtonContainerEl = document.getElementById("next-button-container");
        
        const counterEl = document.getElementById("question-counter");
        const scoreEl = document.getElementById("score-counter");

        // TRUE RANDOM SHUFFLE - Destroys any alternating patterns!
        function shuffleDeck(array) {
            let deck = [...array];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startGame() {
            gameDeck = shuffleDeck(originalVault);
            currentIndex = 0;
            score = 0;
            updateScoreUI();
            loadQuestion();
        }

        function loadQuestion() {
            const currentItem = gameDeck[currentIndex];
            
            counterEl.innerText = `${currentIndex + 1}/${gameDeck.length}`;
            quoteTextEl.innerText = currentItem.text;
            
            revealBoxEl.style.display = "none";
            choiceButtonsEl.style.display = "flex";
            btnSkip.style.display = "block";
            nextButtonContainerEl.style.display = "none";
        }

        function makeGuess(userGuess) {
            const currentItem = gameDeck[currentIndex];
            const isCorrect = (userGuess === currentItem.answer);

            choiceButtonsEl.style.display = "none";
            btnSkip.style.display = "none";
            nextButtonContainerEl.style.display = "flex";

            if (isCorrect) {
                resultTextEl.innerText = "✅ CORRECT!";
                resultTextEl.style.color = "#2ed573";
                score++;
                updateScoreUI();
            } else {
                resultTextEl.innerText = "❌ WRONG!";
                resultTextEl.style.color = "#e74c3c";
            }

            actualAnswerEl.innerText = `It was ${currentItem.answer}`;
            actualAnswerEl.style.color = currentItem.answer === "Holy" ? "#f1c40f" : "#e74c3c";
            
            sourceTextEl.innerText = `Source: ${currentItem.source}`;

            revealBoxEl.style.display = "block";
        }

        function skipQuestion() {
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < gameDeck.length) {
                loadQuestion();
            } else {
                alert(`Game Over! You got ${score} out of ${gameDeck.length} correct. Reshuffling...`);
                startGame();
            }
        }

        function updateScoreUI() {
            scoreEl.innerText = score;
        }

        startGame();
    </script>
</body>
</html>
