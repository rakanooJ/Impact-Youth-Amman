<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Impact Youth Amman</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-image: url('background.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center; 
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        .navbar { background-color: #1c1e21; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100;}
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: 500; }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { background-color: #00a8ff; padding: 8px 16px; border-radius: 5px; color: white !important; margin-left: 15px; }

        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; }

        /* Verse of the Week Card */
        .verse-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            color: #1e293b; 
            text-align: center; 
            margin-bottom: 30px; 
            border-left: 8px solid #f39c12; 
        }
        .verse-text { font-size: 1.6rem; font-style: italic; margin-bottom: 5px; color: #0f172a; }
        .verse-ref { font-weight: bold; color: #64748b; }

        /* Form Selector Styling */
        .selector-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            text-align: center; 
            color: #1e293b;
        }
        select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 2px solid #cbd5e1; 
            font-size: 1.1rem; 
            margin-top: 10px; 
            font-family: inherit;
        }

        /* Google Form Iframe Styling */
        .form-wrapper { 
            background: white; 
            border-radius: 15px; 
            overflow: hidden; 
            height: 800px; 
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .active-form { display: block; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="guidance.html">Real Talk</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>

    <div class="container">
        <div class="verse-card">
            <p class="verse-text">"Do not conform to the pattern of this world, but be transformed by the renewing of your mind."</p>
            <p class="verse-ref">Romans 12:2</p>
        </div>

        <div class="selector-card">
            <h3>What would you like to do?</h3>
            <select id="form-switcher" onchange="updateForm()">
                <option value="prayer">🙏 Send a Prayer Request</option>
                <option value="qna">💡 Q&A or Suggestions</option>
            </select>
        </div>

        <div id="prayer-area" class="form-wrapper active-form">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdvg39ep0_D05gBTp27G9dPwqVRuU1mCAzKCJQNhNAbyESsZQ/viewform?embedded=true">Loading...</iframe>
        </div>

        <div id="qna-area" class="form-wrapper">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe0bn2kgaEt1yMpDZQQAMQwEigog6lkc9Y4-rXMKE7RnVjZwQ/viewform?embedded=true">Loading...</iframe>
        </div>
    </div>

    <script>
        function updateForm() {
            const val = document.getElementById('form-switcher').value;
            document.getElementById('prayer-area').classList.remove('active-form');
            document.getElementById('qna-area').classList.remove('active-form');
            
            if(val === 'prayer') document.getElementById('prayer-area').classList.add('active-form');
            else document.getElementById('qna-area').classList.add('active-form');
        }
    </script>
</body>
</html>
