<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - The Betrayal Game">
    <title>The Betrayal - Impact Youth Amman</title>
    <style>
        /* Global Reset & Dark Theme */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; color: #f8f9fa; line-height: 1.6; 
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }
        
        /* Navigation Bar */
        .navbar { 
            background-color: #1c1e21; padding: 12px 60px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 1rem; }
        .nav-links a:hover { color: #00a8ff; }

        /* Game Container */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        .game-card { 
            background: rgba(30, 41, 59, 0.9); padding: 50px 30px; border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-top: 8px solid #e74c3c;
            min-height: 500px; display: flex; flex-direction: column; justify-content: center; position: relative;
        }

        .title { font-size: 3.5rem; color: #e74c3c; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(231, 76, 60, 0.4); font-weight: 900;}
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 30px; }

        /* Inputs & Buttons */
        .input-group { margin-bottom: 30px; }
        .player-input { 
            width: 100%; max-width: 200px; padding: 15px; font-size: 2rem; 
            text-align: center; border-radius: 10px; border: 2px solid #475569; 
            background: #0f172a; color: white; font-weight: bold;
        }
        .player-input:focus { outline: none; border-color: #e74c3c; }

        .btn { 
            padding: 20px 40px; border: none; border-radius: 12px; font-size: 1.4rem; 
            font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; 
            transition: all 0.2s; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px); }
        .btn-start { background: #e74c3c; margin-top: 10px; }
        .btn-start:hover { background: #c0392b; }
        .btn-reveal { background: #00a8ff; }
        .btn-reveal:hover { background: #008ecc; }
        .btn-hide { background: #f39c12; margin-top: 30px; }
        .btn-hide:hover { background: #d35400; }

        /* ROLE REVEAL UI */
        .role-icon-wrapper { font-size: 6rem; margin-bottom: 10px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6)); }
        .role-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .role-desc { font-size: 1.2rem; color: #cbd5e1; line-height: 1.6; padding: 0 10px; }

        /* Storyteller Dashboard UI */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .dash-card { 
            background: #0f172a; border: 2px solid #475569; border-radius: 12px; padding: 15px; 
            cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; text-align: center;
        }
        .dash-card:hover { transform: translateY(-3px); border-color: #f8f9fa; }
        .dash-card.status-dead { opacity: 0.4; filter: grayscale(100%); border-color: #e74c3c; }
        .dash-card.status-silenced { border-color: #8e44ad; }
        .dash-card.status-silenced::after { content: "🤐"; position: absolute; top: 5px; right: 5px; font-size: 1.5rem; }
        .dash-card.status-dead::after { content: "💀"; position: absolute; top: 5px; right: 5px; font-size: 1.5rem; }

        .dash-num { font-size: 1rem; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
        .dash-icon { font-size: 2.5rem; margin-bottom: 5px; }
        .dash-role { font-size: 1.1rem; font-weight: bold; }

        /* Action Modal */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); border-radius: 20px; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10; }
        .modal.show { display: flex; }
        .modal-btn { margin-bottom: 15px; background: #334155; width: 80%; }
        .modal-btn.kill { background: #e74c3c; }
        .modal-btn.silence { background: #8e44ad; }
        .modal-btn.revive { background: #2ed573; }

        /* Screen States */
        #setup-screen, #lock-screen, #reveal-screen, #dashboard-screen { display: none; }
        .active-screen { display: flex !important; flex-direction: column; justify-content: center; }
        .player-turn-text { font-size: 2rem; font-weight: bold; color: #f8f9fa; margin-bottom: 30px; }

        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } .title { font-size: 2.8rem; } .role-title { font-size: 2rem; } .modal-btn { width: 100%; font-size: 1.1rem; padding: 15px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="spirit-fun.html">Back to Fun</a>
            <a href="connect.html">Connect</a>
        </div>
    </nav>
    
    <div class="container">
        
        <div class="game-card active-screen" id="setup-screen">
            <div class="title">The Betrayal</div>
            <div class="subtitle">Find the imposters before they silence the early church.</div>
            <div class="input-group">
                <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #94a3b8;">Total Players (Min 5)</div>
                <input type="number" id="player-count" class="player-input" min="5" max="30" value="8">
            </div>
            <button class="btn btn-start" onclick="generateDeck()">Hand Out Roles</button>
        </div>

        <div class="game-card" id="lock-screen">
            <div class="player-turn-text" id="lock-text">Pass phone to Player 1</div>
            <button class="btn btn-reveal" id="reveal-btn" onclick="showRole()">👀 I am Player 1</button>
        </div>

        <div class="game-card" id="reveal-screen">
            <div class="role-icon-wrapper" id="role-icon">👤</div>
            <div class="role-title" id="role-title">Loading...</div>
            <div class="role-desc" id="role-desc">Role description goes here.</div>
            <button class="btn btn-hide" onclick="nextPlayer()">🔒 Hide & Pass</button>
        </div>

        <div class="game-card" id="dashboard-screen" style="justify-content: flex-start; padding: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #f1c40f; margin: 0; font-size: 2rem; text-transform: uppercase;">Game Master Panel</h2>
                <button onclick="location.reload()" style="background: transparent; border: 2px solid #e74c3c; color: #e74c3c; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;">End Game</button>
            </div>
            <div class="subtitle" style="text-align: left; margin-bottom: 10px; color: white;">Tap a player card below to update their status during the night phase.</div>
            
            <div class="dash-grid" id="dash-grid">
                </div>

            <div class="modal" id="action-modal">
                <h2 style="color: white; font-size: 2.5rem; margin-bottom: 30px; text-transform: uppercase;" id="modal-player-title">Player X</h2>
                <button class="btn modal-btn kill" onclick="setStatus('dead')">💀 Assassinated</button>
                <button class="btn modal-btn silence" onclick="setStatus('silenced')">🤐 Silenced</button>
                <button class="btn modal-btn revive" onclick="setStatus('alive')">🕊️ Active / Healed</button>
                <button class="btn modal-btn" onclick="closeModal()" style="margin-top: 20px;">❌ Cancel</button>
            </div>
        </div>

    </div>

    <script>
        // MESSIAH REMOVED - Roles strictly focused on deduction and powers
        const roleData = {
            pharisee: { title: "Pharisee", icon: "🐍", color: "#e74c3c", desc: "IMPOSTER: You want to silence the church. Wake up during the night with the other Imposters to eliminate one player. Blend in during the day." },
            judas: { title: "Judas", icon: "💰", color: "#c0392b", desc: "MASTER IMPOSTER: You wake up with the Pharisees at night. PASSIVE POWER: If John the Seer investigates you, you will falsely appear as an innocent Disciple." },
            caiaphas: { title: "Caiaphas", icon: "📜", color: "#8e44ad", desc: "MASTER IMPOSTER: Wake up with the Pharisees at night. ACTIVE POWER: After the elimination, point to a second player to 'Silence' them. They cannot speak a single word during the entire next day." },
            luke: { title: "Luke the Healer", icon: "🌿", color: "#2ed573", desc: "SPECIAL ROLE: The Storyteller will ask you to open your eyes at night. Point to one person. That person cannot be eliminated tonight. You may save yourself, but not twice in a row." },
            john: { title: "John the Seer", icon: "👁️", color: "#9b59b6", desc: "SPECIAL ROLE: The Storyteller will ask you to open your eyes at night. Point to one person. The Storyteller will nod YES if they are an Imposter, or NO if they are innocent (Note: Judas will appear innocent)." },
            peter: { title: "Peter the Rock", icon: "🛡️", color: "#94a3b8", desc: "SPECIAL ROLE: You do not wake up at night. PASSIVE POWER: The first time the Pharisees try to eliminate you, your faith protects you, and you survive the attack." },
            disciple: { title: "Faithful Disciple", icon: "👥", color: "#00a8ff", desc: "CITIZEN: You sleep through the night. Pay close attention during the day, listen to the arguments, and use your vote to find the imposters." }
        };

        let players = []; 
        let currentPlayerIndex = 0;
        let selectedPlayerId = null;

        const setupScreen = document.getElementById("setup-screen");
        const lockScreen = document.getElementById("lock-screen");
        const revealScreen = document.getElementById("reveal-screen");
        const dashScreen = document.getElementById("dashboard-screen");
        const modal = document.getElementById("action-modal");

        function switchScreen(screenToShow) {
            setupScreen.classList.remove("active-screen");
            lockScreen.classList.remove("active-screen");
            revealScreen.classList.remove("active-screen");
            dashScreen.classList.remove("active-screen");
            screenToShow.classList.add("active-screen");
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateDeck() {
            const count = parseInt(document.getElementById("player-count").value);
            if (count < 5) { alert("You need at least 5 players!"); return; }

            let deck = [];
            // Dynamically scale the number of imposters based on group size
            let totalImposters = Math.max(1, Math.round(count / 4));
            
            if (totalImposters === 1) deck.push("pharisee");
            else if (totalImposters === 2) { deck.push("judas"); deck.push("pharisee"); }
            else { deck.push("judas"); deck.push("caiaphas"); for (let i = 0; i < totalImposters - 2; i++) deck.push("pharisee"); }

            // Add special citizens
            deck.push("luke");
            if (count >= 7) deck.push("john");
            if (count >= 9) deck.push("peter");
            
            // Fill the rest of the room with Disciples
            while (deck.length < count) deck.push("disciple");

            shuffle(deck);

            // Populate the Master Tracking Array for the Dashboard
            players = deck.map((roleKey, index) => ({
                id: index + 1,
                role: roleKey,
                status: 'alive' // Default status is 'alive'
            }));

            currentPlayerIndex = 0;
            prepareLockScreen();
        }

        function prepareLockScreen() {
            // If all players have seen their role, open the Dashboard for the leader
            if (currentPlayerIndex >= players.length) {
                renderDashboard();
                switchScreen(dashScreen);
                return;
            }

            const playerNum = currentPlayerIndex + 1;
            document.getElementById("lock-text").innerText = `Pass the phone to Player ${playerNum}`;
            document.getElementById("reveal-btn").innerText = `👀 I am Player ${playerNum}`;
            switchScreen(lockScreen);
        }

        function showRole() {
            const player = players[currentPlayerIndex];
            const roleInfo = roleData[player.role];

            // Setup the visual card for the player
            document.getElementById("role-icon").innerText = roleInfo.icon;
            
            const titleEl = document.getElementById("role-title");
            titleEl.innerText = roleInfo.title;
            titleEl.style.color = roleInfo.color;
            
            document.getElementById("role-desc").innerText = roleInfo.desc;
            
            switchScreen(revealScreen);
        }

        function nextPlayer() {
            currentPlayerIndex++;
            prepareLockScreen();
        }

        // --- DASHBOARD SYSTEM LOGIC ---
        function renderDashboard() {
            const grid = document.getElementById("dash-grid");
            grid.innerHTML = "";

            players.forEach(p => {
                const info = roleData[p.role];
                const card = document.createElement("div");
                
                // Apply CSS classes based on if they are dead, silenced, or alive
                card.className = `dash-card status-${p.status}`;
                card.style.borderTop = `5px solid ${info.color}`;
                
                card.innerHTML = `
                    <div class="dash-num">Player ${p.id}</div>
                    <div class="dash-icon">${info.icon}</div>
                    <div class="dash-role" style="color: ${info.color}">${info.title}</div>
                `;
                
                // Clicking the card opens the action menu
                card.onclick = () => openModal(p.id);
                grid.appendChild(card);
            });
        }

        function openModal(playerId) {
            selectedPlayerId = playerId;
            document.getElementById("modal-player-title").innerText = `Player ${playerId}`;
            modal.classList.add("show");
        }

        function closeModal() {
            modal.classList.remove("show");
            selectedPlayerId = null;
        }

        function setStatus(newStatus) {
            const playerIndex = players.findIndex(p => p.id === selectedPlayerId);
            if (playerIndex !== -1) {
                players[playerIndex].status = newStatus;
                renderDashboard(); // Re-draw the grid with the new status
            }
            closeModal();
        }
    </script>
</body>
</html>
