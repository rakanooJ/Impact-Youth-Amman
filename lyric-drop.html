<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Drop - Impact Youth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; color: #f8f9fa; line-height: 1.6; 
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        .navbar { background-color: #1c1e21; padding: 12px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;}
        .logo img { height: 60px; width: auto; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; text-transform: uppercase;}
        .nav-links a:hover { color: #00a8ff; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; width: 100%; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: center;}

        /* Main Menu Selector */
        #menu-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.5s ease; }
        .menu-title { font-size: 4rem; color: #f1c40f; text-transform: uppercase; letter-spacing: 5px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        .menu-sub { font-size: 1.5rem; color: #cbd5e1; margin-bottom: 50px; }
        
        .deck-selector { display: flex; gap: 30px; width: 100%; justify-content: center; flex-wrap: wrap;}
        .deck-btn { 
            background: #1e293b; border: 2px solid #475569; padding: 40px; border-radius: 20px; 
            width: 320px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center;
        }
        .deck-btn:hover { transform: translateY(-10px); border-color: #00a8ff; background: #334155;}
        .deck-icon { font-size: 5rem; margin-bottom: 15px; }
        .deck-name { font-size: 2rem; color: #fff; font-weight: 900; text-transform: uppercase; }

        /* Game Board */
        #game-screen { display: none; flex-direction: column; width: 100%; animation: fadeIn 0.5s ease; }
        
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .game-title { font-size: 2.5rem; color: #00a8ff; text-transform: uppercase; letter-spacing: 4px; font-weight: 900; margin: 0;}
        
        .scoreboard { display: flex; gap: 20px; background: #111; padding: 10px 20px; border-radius: 10px; border: 2px solid #333;}
        .team-score { font-size: 1.5rem; font-weight: bold; padding: 5px 15px; border-radius: 8px;}
        .red-score { color: #e74c3c; border-bottom: 3px solid #e74c3c; }
        .blue-score { color: #00a8ff; border-bottom: 3px solid #00a8ff; }

        .lyric-card { 
            background: #1e293b; padding: 60px 40px; border-radius: 20px; 
            border: 2px solid #475569; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 30px; position: relative; min-height: 400px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5;
        }
        
        .artist-badge { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #f1c40f; color: #000; padding: 8px 20px; border-radius: 30px; 
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem;
        }

        .lyric-prompt { font-size: 2.8rem; font-weight: 900; color: #fff; line-height: 1.4; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-style: italic;}
        
        .reveal-box { display: none; width: 100%; animation: slideDown 0.4s ease-out forwards; margin-top: 20px;}
        .lyric-answer { font-size: 3rem; font-weight: 900; color: #2ed573; text-transform: uppercase; text-shadow: 0 0 20px rgba(46,213,115,0.4); margin-bottom: 10px;}

        .controls { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 800px; margin: 0 auto; position: relative; z-index: 10;}
        .btn { padding: 20px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: #fff; flex: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.4);}
        .btn:active { transform: scale(0.95); }
        
        .btn-reveal { background: #f39c12; color: #000; width: 100%; max-width: 400px; font-size: 1.5rem;}
        .btn-reveal:hover { background: #d35400; }
        
        .award-controls { display: none; gap: 15px; width: 100%; max-width: 800px; margin: 0 auto; position: relative; z-index: 10;}
        .btn-award-red { background: #e74c3c; } .btn-award-red:hover { background: #c0392b; }
        .btn-award-blue { background: #00a8ff; } .btn-award-blue:hover { background: #008ecc; }
        .btn-wrong { background: #334155; } .btn-wrong:hover { background: #1e293b; }

        .action-bar { display: flex; justify-content: center; gap: 20px; margin-top: 40px; width: 100%;}
        .btn-action { background: transparent; border: 2px solid #475569; color: #cbd5e1; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1.1rem;}
        .btn-action:hover { background: #475569; color: white;}
        .btn-switch { border-color: #00a8ff; color: #00a8ff; }
        .btn-switch:hover { background: #00a8ff; color: white; }

        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        @media (max-width: 768px) { 
            .deck-selector { flex-direction: column; align-items: center; } 
            .header-info { flex-direction: column; gap: 15px;} 
            .lyric-prompt, .lyric-answer { font-size: 1.8rem; } 
            .controls, .award-controls { flex-direction: column; } 
            .action-bar { flex-direction: column; gap: 15px; margin-top: 30px; } 
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links"><a href="spirit-fun.html">Back to Arcade</a></div>
    </nav>

    <div class="container">
        <div id="menu-screen">
            <h1 class="menu-title">Lyric Drop</h1>
            <p class="menu-sub">Select your playlist. Artists will never repeat back-to-back.</p>
            
            <div class="deck-selector">
                <div class="deck-btn" onclick="startDeck('english')">
                    <div class="deck-icon">🇺🇸</div>
                    <div class="deck-name">English Vault</div>
                    <p style="color: #94a3b8; margin-top: 10px;">Dean Lewis, 1D, CAS, Ed Sheeran</p>
                </div>
                <div class="deck-btn" onclick="startDeck('arabic')">
                    <div class="deck-icon">🇯🇴</div>
                    <div class="deck-name">Arabic Vault</div>
                    <p style="color: #94a3b8; margin-top: 10px;">Big Sam, Amr Diab, Cairokee</p>
                </div>
            </div>
        </div>

        <div id="game-screen">
            <div class="header-info">
                <h1 class="game-title" id="active-deck-title">Deck Loaded</h1>
                <div class="scoreboard">
                    <div class="team-score red-score">Red: <span id="score-red">0</span></div>
                    <div class="team-score blue-score">Blue: <span id="score-blue">0</span></div>
                </div>
            </div>

            <div class="lyric-card">
                <div class="artist-badge" id="artist-badge">Artist</div>
                <div class="lyric-prompt" id="lyric-prompt">"Loading lyric..."</div>
                
                <div class="reveal-box" id="reveal-box">
                    <div class="lyric-answer" id="lyric-answer">"THE ANSWER"</div>
                </div>
            </div>

            <audio id="song-player"></audio>

            <div class="controls" id="reveal-controls">
                <button class="btn btn-action" id="btn-play-audio" style="display:none; background: #9b59b6; border: none; color: white;" onclick="playAudio()">🔊 Play Track</button>
                <button class="btn btn-reveal" onclick="revealLyric()">👀 Reveal Answer</button>
            </div>

            <div class="award-controls" id="award-controls">
                <button class="btn btn-award-red" onclick="awardPoints('red')">+1 Red Team</button>
                <button class="btn btn-wrong" onclick="nextCard()">❌ Nobody Got It</button>
                <button class="btn btn-award-blue" onclick="awardPoints('blue')">+1 Blue Team</button>
            </div>

            <div class="action-bar">
                <button class="btn-action" onclick="location.reload()">Reset Entire Game</button>
                <button class="btn-action btn-switch" id="btn-switch-deck" onclick="toggleLanguage()">🔄 Switch to Arabic</button>
            </div>
        </div>
    </div>

    <script>
        const englishVault = [
            // Dean Lewis
            { artist: "Dean Lewis", p: "I look up from the ground to see your sad and teary eyes", a: "You look away from me", file: "audio/dean1.ogg" },
            { artist: "Dean Lewis", p: "It comes and goes in waves", a: "It always does, it always does", file: "audio/dean2.ogg" },
            { artist: "Dean Lewis", p: "How do I say goodbye to someone who's been with me for my whole damn life?", a: "You gave me my name and the color of your eyes", file: "audio/dean3.ogg" },
            { artist: "Dean Lewis", p: "How am I supposed to love you", a: "When I don't love who I am", file: "audio/dean4.ogg" },
            { artist: "Dean Lewis", p: "I know you love her, but it's over, mate", a: "It doesn't matter, put the phone away", file: "audio/dean5.ogg" },
            
            // Cigarettes After Sex
            { artist: "Cigarettes After Sex", p: "Nothing's gonna hurt you baby", a: "As long as you're with me you'll be just fine", file: "audio/Cigarettes1.ogg" },
            { artist: "Cigarettes After Sex", p: "Got the music in you baby, tell me why", a: "Got the music in you baby, tell me why", file: "audio/Cigarettes2.ogg" },
            { artist: "Cigarettes After Sex", p: "Apocalypse", a: "Your lips, my lips, apocalypse", file: "audio/Cigarettes3.ogg" },
            { artist: "Cigarettes After Sex", p: "It's so sweet, knowing that you love me", a: "Though we don't need to say it to each other", file: "audio/Cigarettes4.ogg" },
            { artist: "Cigarettes After Sex", p: "And when you go away, I still see you", a: "With sunlight on your face in my rearview", file: "audio/Cigarettes5.ogg" },
            
            // One Direction
            { artist: "One Direction", p: "Baby you light up my world like nobody else", a: "The way that you flip your hair gets me overwhelmed", file: "audio/oned1.ogg" },
            { artist: "One Direction", p: "Story of my life I take her home", a: "I drive all night to keep her warm", file: "audio/oned2.ogg" },
            { artist: "One Direction", p: "Going out tonight, changes into something red", a: "Her mother doesn't like that kind of dress", file: "audio/oned3.ogg" },
            { artist: "One Direction", p: "Let's go crazy, crazy, crazy 'til we see the sun", a: "I know we only met but let's pretend it's love", file: "audio/oned4.ogg" },
            { artist: "One Direction", p: "I have loved you since we were eighteen", a: "Long before we both thought the same thing", file: "audio/oned5.ogg" },
            
            // Ed Sheeran
            { artist: "Ed Sheeran", p: "I found a love for me", a: "Darling just dive right in", file: "audio/Ed1.ogg" },
            { artist: "Ed Sheeran", p: "When your legs don't work like they used to before", a: "And I can can't sweep you off of your feet", file: "audio/Ed2.ogg" },
            { artist: "Ed Sheeran", p: "I'm in love with the shape of you", a: "We push and pull like a magnet do", file: "audio/Ed3.ogg" },
            { artist: "Ed Sheeran", p: "Loving can hurt, loving can hurt sometimes", a: "But it's the only thing that I know", file: "audio/Ed4.ogg" },
            { artist: "Ed Sheeran", p: "We keep this love in a photograph", a: "We made these memories for ourselves", file: "audio/Ed5.ogg" },
            
            // Coldplay
            { artist: "Coldplay", p: "I used to rule the world", a: "Seas would rise when I gave the word", file: "audio/Coldplay1.ogg" },
            { artist: "Coldplay", p: "Look at the stars, look how they shine for you", a: "And everything you do", file: "audio/Coldplay2.ogg" },
            { artist: "Coldplay", p: "Lights will guide you home", a: "And ignite your bones", file: "audio/Coldplay3.ogg" },
            { artist: "Coldplay", p: "When you try your best, but you don't succeed", a: "When you get what you want, but not what you need", file: "audio/Coldplay4.ogg" },
            { artist: "Coldplay", p: "Nobody said it was easy", a: "It's such a shame for us to part", file: "audio/Coldplay5.ogg" }
        ];

        const arabicVault = [
            // The Secret Mystery Tracks
            { artist: "", p: "انا قوي بس", a: "بس عندك رح الين" }, 
            
            // Big Sam
            { artist: "Big Sam", p: "تسألوش اذا شايل هموم بس اتركوني لحالي بروق", a: "مش حاب الوحدة كاره كل الكون", file: "audio/Big1.ogg" }, 
            { artist: "Big Sam", p: "هاي هي النهاية اللى فيها الحزن بصلي لو كنت اليوم محلي", a: "كنت لعنتي ضلي", file: "audio/Big2.ogg" }, 
            { artist: "Big Sam", p: "بعرف إنك فاهم كل لغات العيون", a: "بس كذابة العيون بالنهاية بتهون", file: "audio/Big3.ogg" }, 
            { artist: "Big Sam", p: "‏بحكوا إني في الكلام مش أي كلام لما القلم ينزف شعر", a: " الجمهور يغني هالكلام", file: "audio/Big4.ogg" }, 
            { artist: "Big Sam", p: "لا مش انا، انا اللي بطلت هداك الانا", a: "انا اللي نسيت كم شهر وسنه", file: "audio/Big5.ogg" },
            
            // Cairokee
            { artist: "Cairokee", p: "يا أبيض يا أسود قصة حياتي وكل حكاياتي", a: "‏مع إني عادي عادي أعيش في النص الرمادي", file: "audio/Cairokee1.ogg" },
            { artist: "Cairokee", p: "في كل شارع في بلادي", a: "صوت الحرية بيتنادي", file: "audio/Cairokee2.ogg" },
            { artist: "Cairokee", p: "‏دخلت واحدة شكلها غيرهم باين قوي أنها مش منهم أجمل واحدة من غير مجهود", a: "لابسة عادي وشعرها مفرود", file: "audio/Cairokee3.ogg" },
            { artist: "Cairokee", p: "‏كل لما أغمض عيني أروح لسنين سابتني سيبتها ", a: "‏ليه بحبها؟ ما هي ماضي عدى وانتهى؟", file: "audio/Cairokee4.ogg" },
            { artist: "Cairokee", p: "‏نفسي أحبك، حب زمان زي العيال، وما أعرفش أنام", a: "أشوفك ارتحت في الكلام وفي بعدك أفضل عد وأحسب الأيام", file: "audio/Cairokee5.ogg" },
            
            // Fairouz
            { artist: "Fairouz", p: "كيفك قال عم بيقولوا صار عندك ولاد", a: "أنا والله كنت مفكرتك برات البلاد", file: "audio/Fairouz1.ogg" },
            { artist: "Fairouz", p: "نسم علينا الهوى من مفرق الوادي", a: "يا هوا دخل الهوى خدني على بلادي", file: "audio/Fairouz2.ogg" },
            { artist: "Fairouz", p: "سألوني الناس عنك يا حبيبي", a: "كتبوا المكاتيب وأخدها الهوى", file: "audio/Fairouz3.ogg" },
            { artist: "Fairouz", p: "حبيتك بالصيف حبيتك بالشتي", a: "نطرتك بالصيف نطرتك بالشتي", file: "audio/Fairouz4.ogg" },
            
            // Amr Diab
            { artist: "Amr Diab", p: "‏خليك فاكرني يا اللي بجمالك بعيونك دول أسرني ", a: "‏خليك فاكرني وأن حس قلبك يوم بقلبي أبقى زورني", file: "audio/Amr1.ogg" },
            { artist: "Amr Diab", p: "حبيبي يا نور العين يا ساكن خيالي", a: "عاشق بقالي سنين ولا غيرك فبالي", file: "audio/Amr2.ogg" },
            { artist: "Amr Diab", p: "‏و الله ما كان على بالي يا هوى و الله ما كان على بالي يا هوى", a: "‏قمرين، قمرين دول ولا عينين", file: "audio/Amr3.ogg" }
        ];

        let gameDeck = [];
        let currentIndex = 0;
        let redScore = 0;
        let blueScore = 0;
        let currentLanguage = '';

        function smartShuffle(array) {
            let shuffled = [...array].sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < shuffled.length - 1; i++) {
                if (shuffled[i].artist !== "" && shuffled[i].artist === shuffled[i + 1].artist) {
                    for (let j = i + 2; j < shuffled.length; j++) {
                        if (shuffled[j].artist !== shuffled[i].artist) {
                            let temp = shuffled[i + 1];
                            shuffled[i + 1] = shuffled[j];
                            shuffled[j] = temp;
                            break;
                        }
                    }
                }
            }
            return shuffled;
        }

        function startDeck(language) {
            currentLanguage = language;
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            loadActiveDeck();
        }

        function toggleLanguage() {
            stopAudio();
            if (currentLanguage === 'english') {
                currentLanguage = 'arabic';
            } else {
                currentLanguage = 'english';
            }
            loadActiveDeck();
        }

        function loadActiveDeck() {
            if (currentLanguage === 'english') {
                gameDeck = smartShuffle(englishVault);
                document.getElementById("active-deck-title").innerText = "English Vault";
                document.getElementById("btn-switch-deck").innerText = "🔄 Switch to Arabic";
                document.getElementById("lyric-prompt").style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
                document.getElementById("lyric-answer").style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            } else {
                gameDeck = smartShuffle(arabicVault);
                document.getElementById("active-deck-title").innerText = "Arabic Vault";
                document.getElementById("btn-switch-deck").innerText = "🔄 Switch to English";
                document.getElementById("lyric-prompt").style.fontFamily = "Tahoma, Arial";
                document.getElementById("lyric-answer").style.fontFamily = "Tahoma, Arial";
            }
            currentIndex = 0;
            loadCard();
        }

        function loadCard() {
            if (currentIndex >= gameDeck.length) {
                alert("Deck finished! Let's shuffle and restart this vault.");
                loadActiveDeck();
                return;
            }

            const card = gameDeck[currentIndex];
            
            document.getElementById("artist-badge").innerText = card.artist ? card.artist : "MYSTERY";
            document.getElementById("lyric-prompt").innerText = `"${card.p}"`;
            document.getElementById("lyric-answer").innerText = `"${card.a}"`;

            const audioBtn = document.getElementById("btn-play-audio");
            const player = document.getElementById("song-player");
            
            if (card.file) {
                player.src = card.file;
                audioBtn.style.display = "block";
            } else {
                player.src = "";
                audioBtn.style.display = "none";
            }

            document.getElementById("reveal-box").style.display = "none";
            document.getElementById("reveal-controls").style.display = "flex";
            document.getElementById("award-controls").style.display = "none";
        }

        function playAudio() {
            const player = document.getElementById("song-player");
            const audioBtn = document.getElementById("btn-play-audio");
            
            if (player.paused) {
                player.play();
                audioBtn.innerText = "⏸ Pause Track";
            } else {
                player.pause();
                audioBtn.innerText = "🔊 Play Track";
            }
        }

        function stopAudio() {
            const player = document.getElementById("song-player");
            if(player) {
                player.pause();
                player.currentTime = 0;
            }
            const audioBtn = document.getElementById("btn-play-audio");
            if(audioBtn) audioBtn.innerText = "🔊 Play Track";
        }

        function revealLyric() {
            stopAudio();
            document.getElementById("reveal-box").style.display = "block";
            document.getElementById("reveal-controls").style.display = "none";
            document.getElementById("award-controls").style.display = "flex";
        }

        function awardPoints(team) {
            if (team === 'red') {
                redScore++;
                document.getElementById("score-red").innerText = redScore;
            } else {
                blueScore++;
                document.getElementById("score-blue").innerText = blueScore;
            }
            nextCard();
        }

        function nextCard() {
            stopAudio();
            currentIndex++;
            loadCard();
        }
    </script>
</body>
</html>
