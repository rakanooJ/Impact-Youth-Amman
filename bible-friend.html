<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Friend - Impact Youth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1c1e21; 
            color: #f8f9fa; 
            text-align: center; 
            padding: 40px 20px; 
            line-height: 1.6;
        }
        
        .navbar { background-color: #1c1e21; padding: 12px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: fixed; top: 0; left: 0; right: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .container { max-width: 700px; margin: 100px auto 40px; background: #334155; padding: 40px; border-radius: 18px; box-shadow: 0 15px 45px rgba(0,0,0,0.6); border: 1px solid #475569; }
        h1 { color: #00a8ff; font-size: 2.5rem; margin-bottom: 10px; }
        #status { margin: 20px 0; font-size: 1rem; color: #cbd5e1; font-style: italic; }
        
        button { background-color: #00a8ff; padding: 18px 35px; border-radius: 50px; color: white; font-weight: bold; font-size: 1.2rem; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 168, 255, 0.4); margin-bottom: 30px; }
        button:hover:not(:disabled) { transform: scale(1.05); background-color: #0097e6; }
        button:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        #conversation { text-align: left; margin-top: 20px; }
        .message { margin-bottom: 15px; padding: 15px 20px; border-radius: 12px; line-height: 1.5; font-size: 1.1rem; }
        .user { background-color: #1e293b; border-left: 4px solid #00a8ff; }
        .ai { background-color: rgba(46, 213, 115, 0.1); border-left: 4px solid #2ed573; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" style="color: white; font-weight: bold; font-size: 1.2rem; text-decoration: none;">🔙 Back to Impact</a>
    </nav>

    <div class="container">
        <h1>Bible Friend AI</h1>
        <p>Your private, voice-activated Biblical guide.</p>
        
        <p id="status">System Online. Ready to listen!</p>
        <button id="talk-btn">🎤 Tap to Speak</button>
        
        <div id="conversation"></div>
    </div>

    <script>
        // --- PASTE YOUR GROQ API KEY HERE ---
        const GROQ_API_KEY = "PASTE_YOUR_GROQ_KEY_HERE";
        
        const statusEl = document.getElementById('status');
        const talkBtn = document.getElementById('talk-btn');
        const convEl = document.getElementById('conversation');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const synth = window.speechSynthesis;
        recognition.continuous = false;

        // Load premium voices in the background
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => {
            availableVoices = window.speechSynthesis.getVoices();
        };
        
        talkBtn.onclick = () => {
            recognition.start();
            statusEl.textContent = "Listening... Speak now!";
            talkBtn.disabled = true;
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            appendMessage("You", transcript, "user");
            statusEl.textContent = "Consulting the Word...";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: [
                            { 
                                role: "system", 
                                // NEW: Forcing the exact layout you wanted!
                                content: `You are Bible Friend, a comforting youth group guide. 
                                If asked to explain a Bible verse, you MUST format your answer exactly like this:
                                Verse: [Quote the verse]
                                Context: [Brief background]
                                Meaning: [Explain it clearly]
                                Life Lesson: [How to apply it today]
                                
                                Keep it brief and spoken-word friendly. Do not use asterisks or markdown formatting.` 
                            },
                            { role: "user", content: transcript }
                        ]
                    })
                });

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                appendMessage("Bible Friend", aiResponse, "ai");
                speakText(aiResponse);
            } catch(e) {
                appendMessage("System", "Sorry, I had trouble reaching the cloud.", "ai");
                console.error(e);
            }
            
            statusEl.textContent = "System Online. Ready to listen!";
            talkBtn.disabled = false;
        };

        // NEW: Upgraded voice function for smoother audio
        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95; 
            utterance.pitch = 1.0; 

            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            const smoothVoice = availableVoices.find(voice => 
                voice.name.includes("Google") || 
                voice.name.includes("Premium") || 
                voice.name.includes("Natural") ||
                voice.name.includes("Samantha")
            );

            if (smoothVoice) {
                utterance.voice = smoothVoice;
            }

            synth.speak(utterance);
        }

        // NEW: Handles the line breaks so it isn't one giant paragraph
        function appendMessage(sender, text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            
            // Converts hidden line breaks into visual breaks on the website
            const formattedText = text.replace(/\n/g, '<br>');
            
            div.innerHTML = `<strong style="color: ${className === 'user' ? '#00a8ff' : '#2ed573'};">${sender}:</strong><br><br>${formattedText}`;
            convEl.appendChild(div);
            // Auto-scrolls to the bottom of the chat
            convEl.scrollTop = convEl.scrollHeight; 
        }
    </script>
</body>
</html>
