<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Holy or Hollywood">
    <title>Bible vs Movie - Impact Youth Amman</title>
    <style>
        /* 1. Global Reset & Pro Background */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: url('background.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center; 
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        
        /* 2. Professional Navigation */
        .navbar { 
            background-color: #1c1e21; 
            padding: 10px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
            position: sticky; top: 0; z-index: 100;
        }
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 1rem; }
        .login-btn { background-color: #00a8ff; padding: 8px 20px; border-radius: 5px; color: white !important; margin-left: 20px; font-weight: bold; }

        /* 3. Header Styling */
        .header-title { 
            text-align: center; 
            padding: 60px 20px; 
            background: rgba(28, 30, 33, 0.8); 
            border-bottom: 1px solid #333;
        }
        .header-title h1 { 
            font-size: 3.5rem; 
            color: #f39c12; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        /* 4. Game Card & Quote Box */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .game-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 60px 40px; 
            border-radius: 15px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            color: #1e293b; 
            border-top: 10px solid #f39c12;
        }
        
        .quote-box { 
            font-size: 2.4rem; 
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 700; 
            margin-bottom: 40px; 
            color: #0f172a; 
            line-height: 1.3;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 5. Choice Buttons */
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .btn-choice { 
            padding: 25px; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            color: white; 
            text-transform: uppercase;
        }
        .btn-bible { background: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3); }
        .btn-movie { background: #9b59b6; box-shadow: 0 5px 15px rgba(155, 89, 182, 0.3); }
        .btn-choice:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn-choice:active { transform: scale(0.95); }

        .btn-util { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #475569; margin-bottom: 10px; }

        .feedback { font-size: 1.5rem; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        @media (max-width: 768px) { 
            .navbar { padding: 10px 20px; } .nav-links { display: none; }
            .header-title h1 { font-size: 2.2rem; }
            .quote-box { font-size: 1.6rem; }
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    
    <div class="header-title">
        <h1>Holy or Hollywood?</h1>
    </div>
    
    <div class="container">
        <div class="game-card">
            <div id="progress" style="margin-bottom:10px; font-weight:bold; color:#64748b;">Question 1 / 50</div>
            <div class="quote-box" id="quote-display">"Loading the next quote..."</div>
            
            <div class="choice-grid">
                <button class="btn-choice btn-bible" onclick="checkAnswer('bible')">📖 Bible</button>
                <button class="btn-choice btn-movie" onclick="checkAnswer('movie')">🎬 Movie</button>
            </div>
            
            <button class="btn-util" onclick="nextQuote()">⏭️ Skip Question</button>

            <div class="feedback" id="feedback-msg"></div>
        </div>
    </div>

    <script>
        const library = [
            { q: "Love is patient, love is kind.", a: "bible" },
            { q: "I'm going to make him an offer he can't refuse.", a: "movie" },
            { q: "In the beginning, God created the heavens and the earth.", a: "bible" },
            { q: "May the Force be with you.", a: "movie" },
            { q: "The Lord is my shepherd; I shall not want.", a: "bible" },
            { q: "There's no place like home.", a: "movie" },
            { q: "For everything there is a season.", a: "bible" },
            { q: "Keep your friends close, but your enemies closer.", a: "movie" },
            { q: "Ask and it will be given to you.", a: "bible" },
            { q: "I'll be back.", a: "movie" },
            { q: "Jesus wept.", a: "bible" },
            { q: "You're gonna need a bigger boat.", a: "movie" },
            { q: "Faith is the substance of things hoped for.", a: "bible" },
            { q: "To infinity and beyond!", a: "movie" },
            { q: "I am the way, the truth, and the life.", a: "bible" },
            { q: "Why so serious?", a: "movie" },
            { q: "Blessed are the peacemakers.", a: "bible" },
            { q: "Hasta la vista, baby.", a: "movie" },
            { q: "Iron sharpens iron.", a: "bible" },
            { q: "Life is like a box of chocolates.", a: "movie" },
            { q: "A house divided against itself cannot stand.", a: "bible" },
            { q: "I am your father.", a: "movie" },
            { q: "Vengeance is mine, says the Lord.", a: "bible" },
            { q: "Say hello to my little friend!", a: "movie" },
            { q: "The truth will set you free.", a: "bible" },
            { q: "Houston, we have a problem.", a: "movie" },
            { q: "Wait for the Lord; be strong.", a: "bible" },
            { q: "You can't handle the truth!", a: "movie" },
            { q: "Be still and know that I am God.", a: "bible" },
            { q: "My precious.", a: "movie" },
            { q: "A friend loves at all times.", a: "bible" },
            { q: "Show me the money!", a: "movie" },
            { q: "Pride goes before destruction.", a: "bible" },
            { q: "Here's looking at you, kid.", a: "movie" },
            { q: "The love of money is the root of all evil.", a: "bible" },
            { q: "Bond. James Bond.", a: "movie" },
            { q: "I can do all things through Christ.", a: "bible" },
            { q: "E.T. phone home.", a: "movie" },
            { q: "Peace I leave with you.", a: "bible" },
            { q: "I see dead people.", a: "movie" },
            { q: "Do not be overcome by evil.", a: "bible" },
            { q: "Just keep swimming.", a: "movie" },
            { q: "Be kind to one another.", a: "bible" },
            { q: "You had me at hello.", a: "movie" },
            { q: "The Lord is my light and my salvation.", a: "bible" },
            { q: "Carpe diem. Seize the day.", a: "movie" },
            { q: "Let your light shine before others.", a: "bible" },
            { q: "May the odds be ever in your favor.", a: "movie" },
            { q: "I'm the king of the world!", a: "movie" },
            { q: "Rejoice always.", a: "bible" }
        ];

        let currentIdx = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuote() {
            if (currentIdx >= library.length) {
                alert("🏆 Full Set Cleared! Shuffling 50 new ones...");
                currentIdx = 0;
                shuffle(library);
            }
            document.getElementById("progress").innerText = `Quote ${currentIdx + 1} / 50`;
            document.getElementById("quote-display").innerText = `"${library[currentIdx].q}"`;
            document.getElementById("feedback-msg").innerText = "";
            document.getElementById("feedback-msg").className = "feedback";
        }

        function checkAnswer(choice) {
            const correct = library[currentIdx].a;
            if (choice === correct) {
                document.getElementById("feedback-msg").innerHTML = "✅ CORRECT!";
                document.getElementById("feedback-msg").className = "feedback correct";
                currentIdx++;
                setTimeout(loadQuote, 1200);
            } else {
                document.getElementById("feedback-msg").innerHTML = `❌ WRONG! That was ${correct.toUpperCase()}.`;
                document.getElementById("feedback-msg").className = "feedback wrong";
                currentIdx++;
                setTimeout(loadQuote, 2000);
            }
        }

        function nextQuote() { currentIdx++; loadQuote(); }

        shuffle(library);
        loadQuote();
    </script>
</body>
</html>
