<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Impact Youth Amman - Bible Trivia">
    <title>Bible Trivia - Impact Youth Amman</title>
    <style>
        /* 1. Global Reset & Professional Background */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: url('background.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center; 
            background-color: #1c1e21; 
            color: #f8f9fa; 
            line-height: 1.6; 
        }
        
        /* 2. Navigation Bar (Matched to Home) */
        .navbar { 
            background-color: #1c1e21; 
            padding: 10px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        .logo img { height: 60px; width: auto; display: block; border-radius: 50%; }
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            margin-left: 15px; 
            font-weight: 500; 
            transition: color 0.3s; 
            font-size: 1rem; 
        }
        .nav-links a:hover { color: #00a8ff; }
        .login-btn { 
            background-color: #00a8ff; 
            padding: 8px 16px; 
            border-radius: 5px; 
            color: white !important; 
            margin-left: 15px; 
            font-weight: bold;
        }

        /* 3. Header Styling */
        .header-title { 
            text-align: center; 
            padding: 50px 20px; 
            background: rgba(28, 30, 33, 0.8); 
            border-bottom: 1px solid #333;
        }
        .header-title h1 { 
            font-size: 3.5rem; 
            color: #2ed573; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        
        /* 4. Game Card & Question Box */
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .game-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 60px 40px; 
            border-radius: 15px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            color: #1e293b; 
            position: relative;
            border-top: 10px solid #2ed573;
        }
        
        .level-badge { 
            background: #3498db; 
            color: white; 
            padding: 8px 25px; 
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 1rem; 
            text-transform: uppercase; 
            margin-bottom: 30px; 
            display: inline-block; 
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .question-text { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 35px; 
            color: #0f172a; 
            line-height: 1.2;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 5. Inputs & Buttons */
        input[type="text"] { 
            width: 100%; 
            padding: 18px; 
            border-radius: 10px; 
            border: 2px solid #cbd5e1; 
            font-size: 1.3rem; 
            text-align: center; 
            margin-bottom: 20px; 
            background: #f8f9fa;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #00a8ff; outline: none; }
        
        .btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            color: white; 
            margin-bottom: 12px;
            display: block;
        }
        .btn-submit { background: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3); }
        .btn-submit:hover { background: #27ae60; transform: translateY(-2px); }
        
        .btn-reveal { background: #e74c3c; }
        .btn-skip { background: #cbd5e1; color: #475569; }

        .feedback { font-size: 1.4rem; font-weight: bold; margin-top: 20px; min-height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }

        @media (max-width: 768px) { 
            .navbar { padding: 10px 20px; } 
            .nav-links { display: none; } 
            .header-title h1 { font-size: 2.5rem; }
            .question-text { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="logo.png" alt="Impact Logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="plans.html">Bible Plans</a>
            <a href="guidance.html">Real Talk</a>
            <a href="spirit-fun.html">Spirit Fun</a>
            <a href="connect.html">Connect</a>
            <a href="index.html#join" class="login-btn">Join Us</a>
        </div>
    </nav>
    
    <div class="header-title">
        <h1>Bible Trivia</h1>
    </div>
    
    <div class="container">
        <div class="game-card">
            <div class="level-badge" id="level-tag">Loading...</div>
            <div class="question-text" id="question-box">Preparing the Word...</div>
            
            <input type="text" id="guess-input" placeholder="Type your answer here..." autocomplete="off">
            
            <button class="btn btn-submit" onclick="checkAnswer()">Check Answer</button>
            <button class="btn btn-reveal" onclick="revealAnswer()">🏳️ Give Up (Show Answer)</button>
            <button class="btn btn-skip" onclick="nextQuestion()">⏭️ Skip to next</button>

            <div class="feedback" id="feedback-msg"></div>
        </div>
    </div>

    <script>
        // FULL LIBRARY OF 50 QUESTIONS
        let questions = [
            { q: "Who built the Ark?", a: ["noah", "نوح"], level: "Easy" },
            { q: "How many disciples did Jesus have?", a: ["12", "twelve", "١٢"], level: "Easy" },
            { q: "Where was Jesus born?", a: ["bethlehem", "بيت لحم"], level: "Easy" },
            { q: "Who was the first man?", a: ["adam", "آدم"], level: "Easy" },
            { q: "Who killed Goliath?", a: ["david", "داود"], level: "Easy" },
            { q: "What is the first book of the Bible?", a: ["genesis", "تكوين"], level: "Easy" },
            { q: "Who was swallowed by a big fish?", a: ["jonah", "يونس"], level: "Easy" },
            { q: "Who led the Israelites out of Egypt?", a: ["moses", "موسى"], level: "Easy" },
            { q: "How many commandments were there?", a: ["10", "ten", "١٠"], level: "Easy" },
            { q: "Who was the strongest man in the Bible?", a: ["samson", "شمشون"], level: "Easy" },
            { q: "Who was the first King of Israel?", a: ["saul", "شاول"], level: "Medium" },
            { q: "Which disciple denied Jesus 3 times?", a: ["peter", "بطرس"], level: "Medium" },
            { q: "What is the longest book in the Bible?", a: ["psalms", "مزامير"], level: "Medium" },
            { q: "Who baptized Jesus?", a: ["john", "يوحنا"], level: "Medium" },
            { q: "How many days was Lazarus in the tomb?", a: ["4", "four", "٤"], level: "Medium" },
            { q: "What was Paul's name before he converted?", a: ["saul", "شاول"], level: "Medium" },
            { q: "Who was Jacob's twin brother?", a: ["esau", "عيسو"], level: "Medium" },
            { q: "What sea did Moses part?", a: ["red sea", "البحر الاحمر"], level: "Medium" },
            { q: "Who wrote the book of Revelation?", a: ["john", "يوحنا"], level: "Medium" },
            { q: "Who recognized Jesus as Messiah as a baby?", a: ["simeon", "سمعان"], level: "Expert" },
            { q: "What is the shortest verse in the Bible?", a: ["jesus wept", "بكى يسوع"], level: "Expert" },
            { q: "How many books are in the New Testament?", a: ["27", "٢٧"], level: "Expert" },
            { q: "Who was the oldest man (969 years)?", a: ["methuselah", "متوشالح"], level: "Expert" },
            { q: "On what mountain were the 10 Commandments given?", a: ["sinai", "سيناء"], level: "Expert" },
            { q: "Who was the youngest king of Israel?", a: ["josiah", "يوشيا"], level: "Expert" },
            { q: "Which tribe were the priests from?", a: ["levi", "لاوي"], level: "Expert" },
            { q: "What was the name of the mountain of sacrifice?", a: ["moriah", "المريا"], level: "Expert" },
            { q: "How many brothers did Joseph have?", a: ["11", "١١"], level: "Medium" },
            { q: "Who was the wife of Isaac?", a: ["rebekah", "رفقة"], level: "Expert" },
            { q: "What was the first plague in Egypt?", a: ["blood", "دم"], level: "Medium" },
            { q: "Who took over as leader after Moses?", a: ["joshua", "يشوع"], level: "Medium" },
            { q: "What city did the walls fall down?", a: ["jericho", "اريحا"], level: "Easy" },
            { q: "Who was the tax collector disciple?", a: ["matthew", "متى"], level: "Medium" },
            { q: "Which disciple was a doctor?", a: ["luke", "لوقا"], level: "Expert" },
            { q: "What is the last word in the Bible?", a: ["amen", "آمين"], level: "Expert" },
            { q: "Who escaped from Sodom?", a: ["lot", "لوط"], level: "Medium" },
            { q: "Who was David's best friend?", a: ["jonathan", "يوناثان"], level: "Expert" },
            { q: "Which book comes after the 4 Gospels?", a: ["acts", "اعمال الرسل"], level: "Medium" },
            { q: "Who was the first woman?", a: ["eve", "حواء"], level: "Easy" },
            { q: "How many days did it rain during the flood?", a: ["40", "forty", "٤٠"], level: "Easy" },
            { q: "What did the dove bring back to Noah?", a: ["olive", "زيتون"], level: "Medium" },
            { q: "Who was the Queen who saved the Jews?", a: ["esther", "استير"], level: "Medium" },
            { q: "What was Jesus' first miracle?", a: ["wine", "خمر"], level: "Easy" },
            { q: "Who is the 'Alpha and Omega'?", a: ["jesus", "يسوع", "god"], level: "Easy" },
            { q: "Who interpreted Pharaoh's dreams?", a: ["joseph", "يوسف"], level: "Medium" },
            { q: "Who was the sister of Moses?", a: ["miriam", "مريم"], level: "Expert" },
            { q: "What did God create on the first day?", a: ["light", "النور"], level: "Medium" },
            { q: "Who lived in the desert eating honey?", a: ["john", "يوحنا"], level: "Easy" },
            { q: "What was the name of the giant David killed?", a: ["goliath", "جليات"], level: "Easy" },
            { q: "How many tribes of Israel were there?", a: ["12", "twelve", "١٢"], level: "Easy" }
        ];

        let currentQ = 0;

        // SHUFFLE ALGORITHM (Fisher-Yates)
        function shuffleQs() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
        }

        function loadQuestion() {
            if (currentQ >= questions.length) {
                alert("🏆 You've cleared all 50 questions! Shuffling for a new round.");
                currentQ = 0;
                shuffleQs();
            }
            let q = questions[currentQ];
            document.getElementById("level-tag").innerText = q.level;
            document.getElementById("question-box").innerText = q.q;
            document.getElementById("guess-input").value = "";
            document.getElementById("feedback-msg").innerText = "";
            document.getElementById("feedback-msg").className = "feedback";
        }

        function checkAnswer() {
            let guess = document.getElementById("guess-input").value.toLowerCase().trim();
            if (questions[currentQ].a.some(ans => guess.includes(ans))) {
                document.getElementById("feedback-msg").innerHTML = "🎯 Correct! Excellent.";
                document.getElementById("feedback-msg").className = "feedback correct";
                currentQ++;
                setTimeout(loadQuestion, 1500);
            } else {
                document.getElementById("feedback-msg").innerHTML = "❌ Not quite! Try again.";
                document.getElementById("feedback-msg").className = "feedback wrong";
            }
        }

        function revealAnswer() {
            document.getElementById("feedback-msg").innerHTML = "The answer was: <b>" + questions[currentQ].a[0] + "</b>";
            document.getElementById("feedback-msg").className = "feedback";
            currentQ++;
            setTimeout(loadQuestion, 3000);
        }

        function nextQuestion() { currentQ++; loadQuestion(); }

        // Start the game
        shuffleQs();
        loadQuestion();
    </script>
</body>
</html>
